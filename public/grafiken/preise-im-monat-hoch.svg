<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was Abnehmspritzen und die Tablette im Monat kosten</title>
<desc id="d">Balkendiagramm der monatlichen Selbstzahlerpreise, Stand 30. September 2026: Wegovy Spritze, 0,25 bis 1,0 mg ca. 170 Euro; Wegovy Spritze, 1,7 mg ca. 235 Euro; Wegovy Spritze, 2,4 mg ca. 280 Euro; Wegovy Tablette, 1,5 mg und 4 mg (30 Stück) ca. 175 Euro; Wegovy Tablette, 9 mg (30 Stück) ca. 235 Euro; Wegovy Tablette, 25 mg (30 Stück) ca. 280 Euro; Ozempic, 0,5 und 1 mg (nur für Typ-2-Diabetes zugelassen) ca. 100 Euro; Mounjaro, 2,5 mg ca. 205 Euro; Mounjaro, 5 mg ca. 280 Euro; Mounjaro, 7,5 mg und 10 mg ca. 385 Euro; Mounjaro, 12,5 mg und 15 mg ca. 490 Euro; Saxenda (5 Pens, etwa 30 Tage bei der höchsten Stufe) ca. 290 Euro. Größenordnungen, gerundet auf 5 Euro; Ozempic ist bei Typ-2-Diabetes Kassenleistung.</desc>
<rect width="1080" height="1350" fill="#EFEFEB"/>
<text x="64" y="101" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was Abnehmspritzen und die</text><text x="64" y="158" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tablette im Monat kosten</text><text x="64" y="211" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Apothekenverkaufspreise für Selbstzahler als Größenordnung, Stand</text><text x="64" y="248" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30. September 2026</text>
<text x="64" y="318" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wegovy</text><text x="64" y="359" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Spritze</text><text x="231.1" y="318" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0,25 bis 1,0 mg</text><rect class="mk" x="517.7" y="294" width="114" height="26" rx="2" fill="#141513"/><text x="643.7" y="318" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 170 €*</text><text x="231.1" y="359" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,7 mg</text><rect class="mk" x="517.7" y="335" width="157.6" height="26" rx="2" fill="#141513"/><text x="687.3" y="359" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 235 €*</text><text x="231.1" y="400" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2,4 mg</text><rect class="mk" x="517.7" y="376" width="187.8" height="26" rx="2" fill="#141513"/><text x="717.5" y="400" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 280 €</text><line x1="64" y1="424.5" x2="1016" y2="424.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="467" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wegovy</text><text x="64" y="508" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tablette</text><text x="64" y="549" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30 Stück</text><text x="231.1" y="467" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,5 mg und 4 mg</text><rect class="mk" x="517.7" y="443" width="117.4" height="26" rx="2" fill="#141513"/><text x="647.1" y="467" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 175 €</text><text x="231.1" y="508" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">9 mg</text><rect class="mk" x="517.7" y="484" width="157.6" height="26" rx="2" fill="#141513"/><text x="687.3" y="508" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 235 €</text><text x="231.1" y="549" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 mg</text><rect class="mk" x="517.7" y="525" width="187.8" height="26" rx="2" fill="#141513"/><text x="717.5" y="549" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 280 €</text><line x1="64" y1="573.5" x2="1016" y2="573.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="616" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ozempic</text><text x="231.1" y="616" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0,5 und 1 mg</text><rect class="mk" x="517.7" y="592" width="67.1" height="26" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.4"/><text x="596.8" y="616" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 100 €</text><text x="231.1" y="657" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nur für Typ-2-Diabetes zugelassen</text><line x1="64" y1="681.5" x2="1016" y2="681.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="724" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mounjaro</text><text x="231.1" y="724" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2,5 mg</text><rect class="mk" x="517.7" y="700" width="137.5" height="26" rx="2" fill="#141513"/><text x="667.2" y="724" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 205 €</text><text x="231.1" y="765" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5 mg</text><rect class="mk" x="517.7" y="741" width="187.8" height="26" rx="2" fill="#141513"/><text x="717.5" y="765" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 280 €</text><text x="231.1" y="806" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7,5 mg und 10 mg</text><rect class="mk" x="517.7" y="782" width="258.2" height="26" rx="2" fill="#141513"/><text x="787.9" y="806" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 385 €</text><text x="231.1" y="847" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">12,5 mg und 15 mg</text><rect class="mk" x="517.7" y="823" width="328.6" height="26" rx="2" fill="#141513"/><text x="858.4" y="847" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 490 €</text><line x1="64" y1="871.5" x2="1016" y2="871.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="914" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Saxenda</text><rect class="mk" x="517.7" y="890" width="194.5" height="26" rx="2" fill="#141513"/><text x="724.2" y="914" font-size="30" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ca. 290 €*</text><text x="231.1" y="955" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5 Pens, etwa 30 Tage bei der höchsten Stufe</text><text x="64" y="1044" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">* Anbieterangabe, Prüfung gegen den Preisvergleich folgt. Heller</text><text x="64" y="1081" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Balken: bei Typ-2-Diabetes Kassenleistung. Größenordnungen,</text><text x="64" y="1118" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gerundet auf 5 €; keine Preisberatung.</text>

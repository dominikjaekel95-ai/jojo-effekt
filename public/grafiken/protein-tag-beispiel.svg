<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Ein Tag mit rund 100 g Protein bei 80 kg</title>
<desc id="d">Gestapelter Balken eines Beispieltags bei 80 Kilogramm Körpergewicht: morgens 200 Gramm Skyr mit Beeren und Haferflocken, etwa 24 Gramm Protein; mittags Salat oder Gemüse mit 120 Gramm Hähnchen, Fisch oder Tofu und einer Scheibe Vollkornbrot, etwa 30 Gramm; nachmittags Hüttenkäse oder ein Protein-Shake und ein Apfel, etwa 20 Gramm; abends Linsen- oder Bohneneintopf mit 2 Eiern oder 150 Gramm Fisch, etwa 30 Gramm. Zusammen rund 100 Gramm, im Zielbereich von 96 bis 128 Gramm (1,2 bis 1,6 Gramm pro Kilogramm).</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ein Tag mit rund 100 g Protein bei 80 kg</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Die vier Mahlzeiten aus dem Beispieltag mit ihrem Proteingehalt, gegenüber dem Zielbereich</text>
<text x="855.6" y="172" font-size="15" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ziel bei 80 kg: 96 bis 128 g</text><path d="M855.6307692307693 194 V184 H1119.5076923076924 V194" fill="none" stroke="#2E5944" stroke-width="2.4"/><text x="64" y="214" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Morgens</text><rect class="mk" x="64" y="228" width="194.9" height="64" rx="1" fill="#141513"/><text x="78" y="270" font-size="21" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 24 g</text><text x="64" y="372" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">200 g Skyr, Beeren, 2 EL</text><text x="64" y="391" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haferflocken</text><text x="261.9" y="214" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittags</text><rect class="mk" x="261.9" y="228" width="244.4" height="64" rx="1" fill="#141513"/><text x="275.9" y="270" font-size="21" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 30 g</text><text x="261.9" y="372" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Salat oder Gemüse, 120 g</text><text x="261.9" y="391" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hähnchen, Fisch oder Tofu, 1</text><text x="261.9" y="410" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Scheibe Vollkornbrot</text><text x="509.3" y="214" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nachmittags</text><rect class="mk" x="509.3" y="228" width="161.9" height="64" rx="1" fill="#141513"/><text x="523.3" y="270" font-size="21" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 20 g</text><text x="509.3" y="372" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hüttenkäse oder</text><text x="509.3" y="391" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein-Shake, ein</text><text x="509.3" y="410" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Apfel</text><text x="674.2" y="214" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Abends</text><rect class="mk" x="674.2" y="228" width="244.4" height="64" rx="1" fill="#141513"/><text x="688.2" y="270" font-size="21" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 30 g</text><text x="674.2" y="372" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Linsen- oder Bohneneintopf, 2 Eier</text><text x="674.2" y="391" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">oder 150 g Fisch</text><text x="933.6" y="270" font-size="21" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">= rund 100 g</text><line x1="64" y1="304" x2="1136" y2="304" stroke="#5E605A" stroke-width="1.2"/><line x1="64" y1="304" x2="64" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="64" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 g</text><line x1="270.2" y1="304" x2="270.2" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="270.2" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 g</text><line x1="476.3" y1="304" x2="476.3" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="476.3" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 g</text><line x1="682.5" y1="304" x2="682.5" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="682.5" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">75 g</text><line x1="888.6" y1="304" x2="888.6" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="888.6" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 g</text><line x1="1094.8" y1="304" x2="1094.8" y2="311" stroke="#5E605A" stroke-width="1.2"/><text x="1094.8" y="330" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">125 g</text><text x="64" y="512" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zusammen rund 100 g Protein und 30 g Ballaststoffe, ohne Kalorienzählen. Die Mengen sind ein Beispiel für 80 kg Körpergewicht; Zielbereich 1,2 bis 1,6 g</text><text x="64" y="533" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein pro kg und Tag. Proteinwerte aus dem Bundeslebensmittelschlüssel, gerundet.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Leidy et al., Am J Clin Nutr 2015; Bundeslebensmittelschlüssel (BLS 3.02), gerundet</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

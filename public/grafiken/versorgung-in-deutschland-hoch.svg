<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wo die Versorgung in Deutschland ohnehin knapp ist</title>
<desc id="d">Balkendiagramm zur Versorgung Erwachsener in Deutschland: Unter der Zufuhrempfehlung lagen bei Magnesium 26 Prozent der Männer und 29 Prozent der Frauen, bei Eisen 14 Prozent der Männer und 58 Prozent der Frauen (Nationale Verzehrsstudie II). Beim Vitamin-D-Wert im Blut lagen 30,2 Prozent unter 30 Nanomol pro Liter (Mangel) und 61,6 Prozent unter 50 Nanomol pro Liter (DEGS1). Erhoben vor der Zeit der GLP-1-Medikamente.</desc>
<rect width="1080" height="1350" fill="#EFEFEB"/>
<text x="64" y="101" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wo die Versorgung in Deutschland</text><text x="64" y="158" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohnehin knapp ist</text><text x="64" y="211" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil der Erwachsenen unter der Zufuhrempfehlung bzw. mit</text><text x="64" y="248" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">niedrigem Vitamin-D-Wert im Blut</text>
<text x="64" y="324" font-size="34" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zufuhr unter der Empfehlung</text><text x="64" y="364" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nationale Verzehrsstudie II</text><line class="g" x1="449.2" y1="390" x2="449.2" y2="668" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="579.9" y1="390" x2="579.9" y2="546" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="579.9" y1="596.4" x2="579.9" y2="668" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="710.6" y1="390" x2="710.6" y2="470" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="710.6" y1="520.4" x2="710.6" y2="668" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="841.3" y1="390" x2="841.3" y2="622" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="972" y1="390" x2="972" y2="668" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="426" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Magnesium, Männer</text><rect class="mk" x="449.2" y="400" width="135.9" height="30" rx="1" fill="#141513"/><text x="599.1" y="430" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">26 %</text><text x="64" y="502" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Magnesium, Frauen</text><rect class="mk" x="449.2" y="476" width="151.6" height="30" rx="1" fill="#141513"/><text x="614.8" y="506" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">29 %</text><text x="64" y="578" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eisen, Männer</text><rect class="mk" x="449.2" y="552" width="73.2" height="30" rx="1" fill="#141513"/><text x="536.4" y="582" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">14 %</text><text x="64" y="654" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eisen, Frauen</text><rect class="mk" x="449.2" y="628" width="303.2" height="30" rx="1" fill="#141513"/><text x="766.4" y="658" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">58 %</text><text x="64" y="734" font-size="34" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vitamin-D-Wert im Blut</text><text x="64" y="774" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gesundheitsstudie DEGS1</text><line class="g" x1="449.2" y1="800" x2="449.2" y2="926" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="579.9" y1="800" x2="579.9" y2="926" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="710.6" y1="800" x2="710.6" y2="804" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="710.6" y1="854.4" x2="710.6" y2="926" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="841.3" y1="800" x2="841.3" y2="880" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="972" y1="800" x2="972" y2="926" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="836" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 30 nmol/l (Mangel)</text><rect class="mk" x="449.2" y="810" width="157.9" height="30" rx="1" fill="#141513"/><text x="621.1" y="840" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30,2 %</text><text x="64" y="912" font-size="30" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 50 nmol/l</text><rect class="mk" x="449.2" y="886" width="322" height="30" rx="1" fill="#141513"/><text x="785.2" y="916" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">61,6 %</text><text x="449.2" y="964" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><text x="579.9" y="964" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 %</text><text x="710.6" y="964" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 %</text><text x="841.3" y="964" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">75 %</text><text x="972" y="964" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 %</text><text x="64" y="1036" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Erhoben vor der Zeit der GLP-1-Medikamente; Vitamin D im Winter</text><text x="64" y="1072" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deutlich niedriger als im Sommer. Wer unter der Spritze kleine</text><text x="64" y="1108" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Portionen isst, startet von dieser Ausgangslage.</text>
<line class="fy" x1="64" y1="1160" x2="1016" y2="1160" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="1202" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Max Rubner-Institut, Nationale Verzehrsstudie II, 2008;</text><text x="64" y="1238" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Rabenberg et al., DEGS1, BMC Public Health 2015</text><text x="64" y="1274" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe</text><text x="64" y="1310" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">(CC BY 4.0)</text><text x="1016" y="1310" font-size="30" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

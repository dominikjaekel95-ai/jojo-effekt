<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie viel Protein nach der Abnehmspritze</title>
<desc id="d">Balkendiagramm des Proteinbedarfs von 1,2 bis 1,6 Gramm pro Kilogramm Körpergewicht: bei 60 Kilogramm 72 bis 96 Gramm am Tag, bei 70 Kilogramm 84 bis 112, bei 80 Kilogramm 96 bis 128, bei 90 Kilogramm 108 bis 144, bei 100 Kilogramm 120 bis 160 Gramm. Verteilt auf drei bis vier Mahlzeiten sind das 25 bis 35 Gramm pro Mahlzeit.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Wie viel Protein nach der Abnehmspritze</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Tagesmenge nach Körpergewicht, Zielkorridor aus Übersichtsarbeiten</text>
<line x1="300" y1="150" x2="300" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="300" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >0 g</text><line x1="500" y1="150" x2="500" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="500" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >50 g</text><line x1="700" y1="150" x2="700" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="700" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >100 g</text><line x1="900" y1="150" x2="900" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="900" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >150 g</text><line x1="1100" y1="150" x2="1100" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="1100" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >200 g</text><text x="56" y="187" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >60 kg</text><text x="140" y="187" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Körpergewicht</text><rect x="300" y="169" width="288" height="28" rx="6" fill="#e3eae4"/><rect x="588" y="169" width="96" height="28" rx="6" fill="#4f6b57"/><text x="694" y="189" font-size="16" font-weight="700" fill="#4f6b57" text-anchor="start" >72 bis 96 g am Tag</text><text x="56" y="247" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >70 kg</text><text x="140" y="247" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Körpergewicht</text><rect x="300" y="229" width="336" height="28" rx="6" fill="#e3eae4"/><rect x="636" y="229" width="112" height="28" rx="6" fill="#4f6b57"/><text x="758" y="249" font-size="16" font-weight="700" fill="#4f6b57" text-anchor="start" >84 bis 112 g am Tag</text><text x="56" y="307" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >80 kg</text><text x="140" y="307" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Körpergewicht</text><rect x="300" y="289" width="384" height="28" rx="6" fill="#e3eae4"/><rect x="684" y="289" width="128" height="28" rx="6" fill="#4f6b57"/><text x="822" y="309" font-size="16" font-weight="700" fill="#4f6b57" text-anchor="start" >96 bis 128 g am Tag</text><text x="56" y="367" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >90 kg</text><text x="140" y="367" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Körpergewicht</text><rect x="300" y="349" width="432" height="28" rx="6" fill="#e3eae4"/><rect x="732" y="349" width="144" height="28" rx="6" fill="#4f6b57"/><text x="886" y="369" font-size="16" font-weight="700" fill="#4f6b57" text-anchor="start" >108 bis 144 g am Tag</text><text x="56" y="427" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >100 kg</text><text x="140" y="427" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Körpergewicht</text><rect x="300" y="409" width="480" height="28" rx="6" fill="#e3eae4"/><rect x="780" y="409" width="160" height="28" rx="6" fill="#4f6b57"/><text x="950" y="429" font-size="16" font-weight="700" fill="#4f6b57" text-anchor="start" >120 bis 160 g am Tag</text><text x="56" y="520" font-size="17" font-weight="400" fill="#1a1a1a" text-anchor="start" >Empfehlung für Gewichtsabnahme und -erhalt: 1,2 bis 1,6 g Protein pro kg Körpergewicht und Tag.</text><text x="56" y="550" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Verteilt auf drei bis vier Mahlzeiten sind das 25 bis 35 g pro Mahlzeit; bei Nierenerkrankungen vorher ärztlich klären.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Leidy et al., Am J Clin Nutr 2015;101(6):1320S–1329S</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 68</text><text x="910" y="566" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 120</text><line x1="580.7" y1="140" x2="580.7" y2="540" stroke="#141513" stroke-width="1.2"/><text x="589.7" y="150" font-size="15" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">letzte Dosis</text><text x="150" y="150" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68 Wochen mit Semaglutid</text><text x="910" y="150" font-size="14" font-weight="420" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">52 Wochen ohne Medikament</text><path d="M150 180 C289.3333333333333 208.8 435 216 580.6666666666666 216 C694.6666666666666 216 796 189 910 181.8" fill="none" stroke="#878982" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0.1 6.5"/><path d="M150 180 C264 405 416 491.4 580.6666666666666 491.4" fill="none" stroke="#141513" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M580.6666666666666 491.4 C637.6666666666667 491.4 732.6666666666667 316.8 910 280.79999999999995" fill="none" stroke="#7A4718" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580.7" cy="216" r="4.5" fill="#878982" stroke="#EFEFEB" stroke-width="2"/><circle cx="910" cy="181.8" r="4.5" fill="#878
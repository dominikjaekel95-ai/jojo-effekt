t-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leinsamen, geschrotet</text><text x="252.3" y="397" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 EL (10 g)</text><rect class="mk" x="470" y="379" width="216" height="22" rx="1" fill="#2E5944"/><text x="696" y="397" font-size="18" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4 g</text><text x="64" y="439" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Glucomannan</text><text x="187.2" y="439" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tagesmenge laut Angabe</text><rect class="mk" x="470" y="421" width="162" height="22" rx="1" fill="none" stroke="#141513" stroke-width="1.6"/><text x="642" y="439" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 g</text><text x="64" y="506" font-size="15" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Richtwert: mindestens 30 g am Tag</text><rect x="64" y="518" width="21" height="21" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><rect x="90" y="518" width="21" height="21" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><rect x="116" y="518" width="2
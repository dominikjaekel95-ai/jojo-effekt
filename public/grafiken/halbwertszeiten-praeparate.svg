<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</title>
<desc id="d">Balkendiagramm der Halbwertszeiten: Semaglutid etwa eine Woche, weitgehend abgebaut nach etwa fünf Wochen und laut Fachinformation bis etwa sieben Wochen nachweisbar; Tirzepatid etwa fünf Tage, abgebaut nach etwa 25 Tagen; Liraglutid etwa 13 Stunden, abgebaut nach etwa drei Tagen. Faustregel: fünf Halbwertszeiten.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Halbwertszeit laut Fachinformation und daraus abgeleitete Zeit bis zum weitgehenden Abbau</text>
<line x1="400" y1="156" x2="400" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="400" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">letzte Dosis</text><line x1="500.8" y1="156" x2="500.8" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="500.8" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 7</text><line x1="601.6" y1="156" x2="601.6" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="601.6" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 14</text><line x1="702.4" y1="156" x2="702.4" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="702.4" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 21</text><line x1="803.2" y1="156" x2="803.2" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="803.2" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 28</text><line x1="904" y1="156" x2="904" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="904" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 35</text><line x1="1004.8" y1="156" x2="1004.8" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="1004.8" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 42</text><line x1="1105.6" y1="156" x2="1105.6" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="1105.6" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tag 49</text><text x="64" y="196" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid</text><text x="64" y="220" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wegovy (Spritze und Tablette),</text><text x="64" y="239" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ozempic, Rybelsus</text><rect class="mk" x="400" y="178" width="100.8" height="20" rx="2" fill="#141513"/><text x="510.8" y="193" font-size="15" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Halbwertszeit etwa 1 Woche</text><rect class="mk" x="400" y="206" width="504" height="20" rx="2" fill="#E5E5DF" stroke="#5E605A" stroke-width="1.2"/><text x="894" y="221" font-size="15" font-weight="580" fill="#3F413C" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" class="in">weitgehend abgebaut nach etwa 5 Wochen</text><rect class="mk" x="904" y="206" width="201.6" height="20" rx="2" fill="none" stroke="#5E605A" stroke-width="1.4" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="1004.8" y="246" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachweisbar bis etwa 7 Wochen</text><text x="64" y="304" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tirzepatid</text><text x="64" y="328" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mounjaro</text><rect class="mk" x="400" y="286" width="72" height="20" rx="2" fill="#141513"/><text x="482" y="301" font-size="15" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Halbwertszeit etwa 5 Tage</text><rect class="mk" x="400" y="314" width="360" height="20" rx="2" fill="#E5E5DF" stroke="#5E605A" stroke-width="1.2"/><text x="750" y="329" font-size="15" font-weight="580" fill="#3F413C" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" class="in">weitgehend abgebaut nach etwa 25 Tagen</text><text x="64" y="412" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Liraglutid</text><text x="64" y="436" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Saxenda</text><rect class="mk" x="400" y="394" width="7.8" height="20" rx="2" fill="#141513"/><text x="417.8" y="409" font-size="15" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Halbwertszeit etwa 13 Stunden</text><rect class="mk" x="400" y="422" width="39" height="20" rx="2" fill="#E5E5DF" stroke="#5E605A" stroke-width="1.2"/><text x="449" y="437" font-size="15" font-weight="580" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">weitgehend abgebaut nach etwa 3 Tagen</text><text x="64" y="528" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Faustregel: Nach etwa fünf Halbwertszeiten ist ein Wirkstoff weitgehend abgebaut. Die Wirkung auf den Appetit lässt schon vorher spürbar nach. Laut</text><text x="64" y="549" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fachinformation ist Semaglutid nach der letzten Dosis noch etwa sieben Wochen im Blut nachweisbar; daher die Angabe „fünf bis sieben Wochen“.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Fachinformationen Wegovy, Ozempic, Rybelsus, Mounjaro, Saxenda (EMA-Produktinformationen)</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum das Gewicht nach dem Absetzen zurückkommt</title>
<desc id="d">Vier Karten mit den Mechanismen des Jojo-Effekts nach der Abnehmspritze: Die Appetitbremse fällt weg, sobald der Wirkstoff abgebaut ist (Semaglutid nach etwa fünf bis sieben Wochen, Tirzepatid nach etwa 25 Tagen); die Hungerhormone Ghrelin und Leptin bleiben noch ein Jahr nach einer Diät verschoben; der Ruheenergieverbrauch blieb in einer Studie sechs Jahre nach starkem Gewichtsverlust abgesenkt; rund 40 Prozent des Gewichtsverlusts unter Semaglutid entfielen auf fettfreie Masse. Dagegen belegt: Krafttraining und Protein.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Warum das Gewicht nach dem Absetzen zurückkommt</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Vier belegte Mechanismen hinter dem Jojo-Effekt nach der Abnehmspritze</text>
<rect x="56" y="150" width="250" height="330" rx="14" fill="#edebe6"/><text x="181" y="212" font-size="26" font-weight="700" fill="#4f6b57" text-anchor="middle" >5–7 Wochen</text><line x1="80" y1="236" x2="282" y2="236" stroke="#dedbd4" stroke-width="1.5"/><text x="80" y="272" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >Die Appetitbremse</text><text x="80" y="296" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >fällt weg</text><text x="80" y="340" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Semaglutid ist nach etwa</text><text x="80" y="362" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >fünf bis sieben Wochen</text><text x="80" y="384" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >abgebaut, Tirzepatid nach</text><text x="80" y="406" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >etwa 25 Tagen.</text><text x="80" y="455" font-size="12" font-weight="400" fill="#6f6f6f" text-anchor="start" >Fachinformationen (EMA)</text><rect x="330" y="150" width="250" height="330" rx="14" fill="#edebe6"/><text x="455" y="212" font-size="22" font-weight="700" fill="#4f6b57" text-anchor="middle" >Ghrelin ↑  Leptin ↓</text><line x1="354" y1="236" x2="556" y2="236" stroke="#dedbd4" stroke-width="1.5"/><text x="354" y="272" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >Hungerhormone</text><text x="354" y="296" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >bleiben verschoben</text><text x="354" y="340" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Noch ein Jahr nach einer</text><text x="354" y="362" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Diät messbar: mehr Hunger,</text><text x="354" y="384" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >weniger Sättigung.</text><text x="354" y="455" font-size="12" font-weight="400" fill="#6f6f6f" text-anchor="start" >Sumithran et al., NEJM 2011</text><rect x="604" y="150" width="250" height="330" rx="14" fill="#edebe6"/><text x="729" y="212" font-size="26" font-weight="700" fill="#4f6b57" text-anchor="middle" >6 Jahre</text><line x1="628" y1="236" x2="830" y2="236" stroke="#dedbd4" stroke-width="1.5"/><text x="628" y="272" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >Weniger Energie</text><text x="628" y="296" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >in Ruhe</text><text x="628" y="340" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Der Ruheenergieverbrauch</text><text x="628" y="362" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >blieb nach starkem Gewichts-</text><text x="628" y="384" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >verlust abgesenkt.</text><text x="628" y="455" font-size="12" font-weight="400" fill="#6f6f6f" text-anchor="start" >Fothergill et al., Obesity 2016</text><rect x="878" y="150" width="250" height="330" rx="14" fill="#edebe6"/><text x="1003" y="212" font-size="26" font-weight="700" fill="#a35f4d" text-anchor="middle" >rund 40 %</text><line x1="902" y1="236" x2="1104" y2="236" stroke="#dedbd4" stroke-width="1.5"/><text x="902" y="272" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >Ein Teil des Verlusts</text><text x="902" y="296" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >war Muskel</text><text x="902" y="340" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >des Gewichtsverlusts unter</text><text x="902" y="362" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Semaglutid entfielen auf</text><text x="902" y="384" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >fettfreie Masse.</text><text x="902" y="455" font-size="12" font-weight="400" fill="#6f6f6f" text-anchor="start" >STEP-1-DXA-Substudie 2021</text><text x="56" y="530" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Vier Mechanismen hinter dem Jojo-Effekt. Dagegen belegt: Krafttraining (Jensen 2024, Sardeli 2018) und Protein (Leidy 2015).</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="12.5" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Fachinformationen (EMA); Sumithran et al. 2011; Fothergill et al. 2016; Wilding et al. 2021; Jensen 2024; Sardeli 2018; Leidy 2015</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

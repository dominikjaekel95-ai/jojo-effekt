<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wiegen mit Zonen: was die STOP-Regain-Studie zeigt</title>
<desc id="d">STOP-Regain-Studie mit 314 Erwachsenen nach mindestens 10 Prozent Gewichtsverlust, tägliches Wiegen über 18 Monate. Zonen bezogen auf das Gewicht nach der Abnahme, zu Studienbeginn: grün bis plus 1,4 Kilogramm, gelb bis plus 2,3 Kilogramm, obere Zone (in der Studie rot) ab plus 2,3 Kilogramm, jeweils mit vorher festgelegter Reaktion. Nach 18 Monaten hatten in der persönlich betreuten Gruppe 45,7 Prozent 2,3 Kilogramm oder mehr wieder zugenommen, in der Kontrollgruppe 72,4 Prozent. Wiegen ohne festgelegte Reaktion verhinderte die Wiederzunahme in einer späteren Studie (LIMIT, 2019) nicht.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wiegen mit Zonen: was die STOP-Regain-Studie zeigt</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">314 Erwachsene nach mindestens 10 % Gewichtsverlust, 18 Monate; tägliches Wiegen mit festgelegter Reaktion je Zone</text>
<text x="64" y="166" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht nach der Abnahme (Studienbeginn)</text><text x="564.3" y="166" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+1,4 kg</text><text x="885.9" y="166" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+2,3 kg</text><rect class="mk" x="64" y="180" width="500.3" height="60" rx="0" fill="#2E5944"/><rect class="mk" x="564.3" y="180" width="321.6" height="60" rx="0" fill="#E8CF55"/><rect class="mk" x="885.9" y="180" width="250.1" height="60" rx="0" fill="#7A4718"/><text x="80" y="206" font-size="18" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">bis +1,4 kg</text><text x="80" y="228" font-size="14" font-weight="420" fill="#EFEFEB" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" class="in">Zone grün</text><text x="580.3" y="206" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">bis +2,3 kg</text><text x="580.3" y="228" font-size="14" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" class="in">Zone gelb</text><text x="901.9" y="206" font-size="18" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">ab +2,3 kg</text><text x="901.9" y="228" font-size="14" font-weight="420" fill="#EFEFEB" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" class="in">obere Zone (in der Studie: rot)</text><text x="64" y="294" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil, der 2,3 kg oder mehr wieder zunahm</text><line class="g" x1="470" y1="312" x2="470" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="470" y="464" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line class="g" x1="610" y1="312" x2="610" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="610" y="464" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 %</text><line class="g" x1="750" y1="312" x2="750" y2="335.4" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="750" y1="366.7" x2="750" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="750" y="464" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 %</text><line class="g" x1="890" y1="312" x2="890" y2="397.4" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="890" y1="428.7" x2="890" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="890" y="464" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">75 %</text><line class="g" x1="1030" y1="312" x2="1030" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="1030" y="464" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 %</text><text x="64" y="346" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wiegen mit Zonen</text><text x="64" y="366" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">persönlich betreute Gruppe</text><rect class="mk" x="470" y="334" width="255.9" height="30" rx="1" fill="#7A4718"/><text x="735.9" y="357" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">45,7 %</text><text x="64" y="408" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kontrollgruppe</text><text x="64" y="428" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohne dieses Programm</text><rect class="mk" x="470" y="396" width="405.4" height="30" rx="2" fill="#E5E5DF" stroke="#878982" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="885.4" y="419" font-size="22" font-weight="560" fill="#5E605A" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">72,4 %</text><text x="64" y="512" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zu jeder Zone gehörte eine vorher festgelegte Reaktion. Wiegen ohne festgelegte Reaktion verhinderte die Wiederzunahme in einer späteren</text><text x="64" y="534" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Studie nicht (LIMIT, 2019).</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Wing et al., STOP Regain, NEJM 2006;355(15):1563–1571; Daley et al., LIMIT, Public Health Res 2019</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

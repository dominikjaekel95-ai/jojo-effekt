="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6</text><line class="g" x1="777.5" y1="156" x2="777.5" y2="206.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="777.5" y1="229.6" x2="777.5" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="777.5" y1="319.6" x2="777.5" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="777.5" y1="409.6" x2="777.5" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="777.5" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7</text><line class="g" x1="840" y1="156" x2="840" y2="206.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="840" y1="229.6" x2="840" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="840" y1="319.6" x2="840" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="840" y1="409.6" x2="840" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="840" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8</text><line class="g" x1="902.5" y1="156" x2="902.5" y2="206.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="902.5" y1="229.6" x2="902.5" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="902.5" y1="319.6" x2="902.5" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="902.5" y1="409.6" x2="902.5" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="902.5" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">9</text><line class="g" x1="965" y1="156" x2="965" y2="269.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="965" y1="292.6" x2="965" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="965" y1="319.6" x2="965" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="965" y1="409.6" x2="965" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="965" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">10</text><line class="g" x1="1027.5" y1="156" x2="1027.5" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1027.5" y1="319.6" x2="1027.5" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1027.5" y1="409.6" x2="1027.5" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="1027.5" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">11</text><line class="g" x1="1090" y1="156" x2="1090" y2="296.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1090" y1="319.6" x2="1090" y2="386.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1090" y1="409.6" x2="1090" y2="418" stroke="#D3D4CD" stroke-width="1"/><text x="1090" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">12</text><text x="64" y="196" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Schnelle Abnahme</text><text x="340" y="222" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Der Auslöser: Viele Haare wechseln gleichzeitig in die Ruhephase; sichtbar ist noch nichts</text><text x="64" y="286" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haare fallen aus</text><text x="340" y="312" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Beginnt zwei bis drei Monate nach dem Auslöser; klingt meist innerhalb von etwa sechs Monaten nach Beginn ab</text><text x="64" y="376" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haare wachsen nach</text><text x="340" y="402" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nachwachsende Haare werden sichtbar, sobald der Auslöser weggefallen ist; bis zur alten Länge dauert es länger</text><rect class="mk" x="340" y="183" width="125" height="14" rx="2" fill="#141513"/><rect class="mk" x="465" y="273" width="250" height="14" rx="2" fill="#141513"/><rect class="mk" x="715" y="273" width="187.5" height="14" rx="2" fill="none" stroke="#141513" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="912.5" y="285" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">klingt ab</text><rect class="mk" x="715" y="363" width="375" height="14" rx="2" fill="#2E5944"/><line x1="64" y1="446" x2="1136" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="476" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was sich beeinflussen lässt</text><text x="64" y="502" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein 1,2 bis 1,6 g pro kg Körpergewicht am Tag · Eisenwert (Ferritin) prüfen lassen · Zink und Biotin nur bei nachgewiesener Lücke</text><text x="64" y="526" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ärztlich abklären: länger als sechs Monate, fleckig oder mit Müdigkeit und Frieren (Eisen, Schilddrüse)</text><text x="64" y="556" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verlauf schematisch; der Zeitpunkt hängt am Auslöser, nicht am Medikament.</text>

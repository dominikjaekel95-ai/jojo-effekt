<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Die ersten 20 Wochen nach der letzten Dosis</title>
<desc id="d">Zeitachse über 20 Wochen nach der letzten Dosis einer Abnehmspritze: Der Wirkstoff ist nach etwa fünf bis sieben Wochen weitgehend abgebaut, der Appetit kehrt ab Woche 2 bis 5 zurück, die Gewichtszunahme ist ab Woche 8 messbar und steigt bis etwa Woche 20. Ein Kontrolltermin 8 bis 12 Wochen nach der letzten Dosis ist markiert.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Die ersten 20 Wochen nach der letzten Dosis</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was aus Pharmakologie und Studien ableitbar ist; der individuelle Verlauf weicht ab</text>
<line x1="360" y1="162" x2="360" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="360" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 0</text><line x1="508" y1="162" x2="508" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="508" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 4</text><line x1="656" y1="162" x2="656" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="656" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 8</text><line x1="804" y1="162" x2="804" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="804" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 12</text><line x1="952" y1="162" x2="952" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="952" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 16</text><line x1="1100" y1="162" x2="1100" y2="556" stroke="#D3D4CD" stroke-width="1"/><text x="1100" y="150" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 20</text><text x="64" y="208" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wirkstoff im Körper</text><text x="360" y="236" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach etwa fünf Halbwertszeiten weitgehend abgebaut (Semaglutid etwa 1 Woche, Tirzepatid etwa 5 Tage)</text><text x="64" y="306" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Appetit kommt zurück</text><text x="360" y="334" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 2 bis 5, mit sinkendem Wirkstoffspiegel; bleibt danach</text><text x="64" y="404" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zunahme messbar</text><text x="360" y="432" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ab Woche 8 signifikant, Anstieg bis etwa Woche 20 (Meta-Analyse randomisierter Studien)</text><text x="64" y="502" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kontrolltermin</text><text x="360" y="530" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ärztlicher Kontrolltermin 8 bis 12 Wochen nach der letzten Dosis: dann zeigt sich, ob die Zunahme beginnt</text><rect class="mk" x="360" y="195" width="185" height="14" rx="2" fill="#141513"/><rect class="mk" x="545" y="195" width="74" height="14" rx="2" fill="none" stroke="#141513" stroke-width="1.4" stroke-dasharray="0.1 4" stroke-linecap="round"/><rect class="mk" x="434" y="293" width="111" height="14" rx="2" fill="#7A4718"/><line x1="545" y1="300" x2="1100" y2="300" stroke="#7A4718" stroke-width="2"/><rect class="mk" x="656" y="391" width="438" height="14" rx="2" fill="#7A4718"/><path d="M1098 388 L1108 398 L1098 408" fill="none" stroke="#7A4718" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect class="mk" x="656" y="489" width="148" height="14" rx="2" fill="none" stroke="#141513" stroke-width="1.6"/>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Fachinformationen Wegovy und Mounjaro (EMA); Wu et al., Meta-Analyse, BMC Medicine 2025</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

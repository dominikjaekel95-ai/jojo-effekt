<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Weihnachten auf der Waage: was Studien messen</title>
<desc id="d">Zwei Balkengruppen: Zehn Tage nach Weihnachten lag das Gewicht in Deutschland im Mittel 0,6 Prozent höher als zehn Tage davor, zu Ostern 0,2 Prozent. In einer europäischen Studie mit Menschen in der Haltephase nach mindestens 5 Prozent Gewichtsverlust stieg es über Weihnachten um 1,35 Prozent. In einer randomisierten Studie wog die Gruppe, die sich mindestens zweimal pro Woche wog, notierte und zehn Tipps bekam, nach den Feiertagen 0,13 Kilogramm weniger, die Vergleichsgruppe 0,37 Kilogramm mehr; Unterschied 0,49 Kilogramm.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weihnachten auf der Waage: was Studien messen</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewichtsänderung über die Feiertage in drei Studien, Mittelwerte</text>
<line x1="600" y1="176" x2="600" y2="334" stroke="#5E605A" stroke-width="1.2"/><line x1="600" y1="410" x2="600" y2="508" stroke="#5E605A" stroke-width="1.2"/><text x="64" y="160" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht nach den Feiertagen gegenüber davor</text><text x="64" y="204" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Deutschland, Weihnachten</text><text x="64" y="223" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">vernetzte Waagen, 10 Tage danach gegenüber 10 Tagen davor</text><rect class="mk" x="600" y="192" width="168" height="22" rx="1" fill="#7A4718"/><text x="778" y="210" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,6 %</text><text x="64" y="256" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Deutschland, Ostern</text><text x="64" y="275" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gleiche Messung</text><rect class="mk" x="600" y="244" width="56" height="22" rx="1" fill="#7A4718"/><text x="666" y="262" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,2 %</text><text x="64" y="308" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haltephase nach Gewichtsverlust, Weihnachten</text><text x="64" y="327" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">europäische Studie, vorher mindestens 5 % abgenommen</text><rect class="mk" x="600" y="296" width="378" height="22" rx="1" fill="#7A4718"/><text x="988" y="314" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+1,35 %</text><text x="64" y="392" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wiegen über die Feiertage</text><text x="311.4" y="392" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">randomisierte Studie, zwei Weihnachtsperioden</text><text x="64" y="432" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mindestens zweimal pro Woche wiegen,</text><text x="64" y="451" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">notieren, zehn Tipps</text><rect class="mk" x="490.8" y="425" width="109.2" height="22" rx="1" fill="#2E5944"/><text x="480.8" y="443" font-size="22" font-weight="560" fill="#2E5944" text-anchor="end" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−0,13 kg</text><text x="64" y="490" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vergleichsgruppe</text><rect class="mk" x="600" y="477" width="310.8" height="22" rx="2" fill="#E5E5DF" stroke="#878982" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="920.8" y="495" font-size="22" font-weight="560" fill="#5E605A" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,37 kg</text><text x="64" y="538" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Unterschied in der randomisierten Studie: 0,49 kg. In der Waagen-Studie war etwa die Hälfte der Zunahme kurz danach wieder weg; die andere Hälfte blieb bis in</text><text x="64" y="557" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">den Sommer oder länger.</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Helander et al., NEJM 2016; Turicchi et al., NoHoW, PLoS ONE 2020; Mason et al., BMJ 2018</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

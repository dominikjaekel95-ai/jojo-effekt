<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Ein Tag mit rund 100 g Protein bei 80 kg</title>
<desc id="d">Gestapelter Balken eines Beispieltags bei 80 Kilogramm Körpergewicht: morgens 200 Gramm Skyr mit Beeren und 2 Esslöffeln Haferflocken, etwa 24 Gramm Protein; mittags Salat oder Gemüse mit 120 Gramm Hähnchen, Fisch oder Tofu und einer Scheibe Vollkornbrot, etwa 30 Gramm (mit Tofu weniger); nachmittags Hüttenkäse oder ein Protein-Shake und ein Apfel, etwa 20 Gramm; abends Linsen- oder Bohneneintopf mit 2 Eiern oder 150 Gramm Fisch, etwa 30 Gramm. Zusammen rund 100 Gramm Protein, im Zielbereich von 96 bis 128 Gramm (1,2 bis 1,6 Gramm pro Kilogramm), und rund 30 Gramm Ballaststoffe.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ein Tag mit rund 100 g Protein bei 80 kg</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Die vier Mahlzeiten aus dem Beispieltag mit ihrem Proteingehalt, gegenüber dem Zielbereich</text>
<text x="855.6" y="168" font-size="14" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ziel bei 80 kg: 96 bis 128 g</text><path d="M855.6307692307693 190 V180 H1119.5076923076924 V190" fill="none" stroke="#2E5944" stroke-width="2.4"/><text x="64" y="210" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Morgens</text><rect class="mk" x="64" y="224" width="194.9" height="64" rx="1" fill="#141513"/><text x="78" y="266" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 24 g</text><text x="64" y="368" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">200 g Skyr, Beeren, 2 EL</text><text x="64" y="387" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haferflocken</text><text x="261.9" y="210" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittags</text><rect class="mk" x="261.9" y="224" width="244.4" height="64" rx="1" fill="#141513"/><text x="275.9" y="266" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 30 g</text><text x="261.9" y="368" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Salat oder Gemüse, 120 g</text><text x="261.9" y="387" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hähnchen, Fisch oder Tofu,</text><text x="261.9" y="406" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 Scheibe Vollkornbrot</text><text x="509.3" y="210" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nachmittags</text><rect class="mk" x="509.3" y="224" width="161.9" height="64" rx="1" fill="#141513"/><text x="523.3" y="266" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 20 g</text><text x="509.3" y="368" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hüttenkäse oder</text><text x="509.3" y="387" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein-Shake, ein</text><text x="509.3" y="406" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Apfel</text><text x="674.2" y="210" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Abends</text><rect class="mk" x="674.2" y="224" width="244.4" height="64" rx="1" fill="#141513"/><text x="688.2" y="266" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">ca. 30 g</text><text x="674.2" y="368" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Linsen- oder Bohneneintopf,</text><text x="674.2" y="387" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2 Eier oder 150 g Fisch</text><text x="933.6" y="266" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">= rund 100 g</text><line x1="64" y1="300" x2="1136" y2="300" stroke="#5E605A" stroke-width="1.2"/><line x1="64" y1="300" x2="64" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="64" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 g</text><line x1="270.2" y1="300" x2="270.2" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="270.2" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 g</text><line x1="476.3" y1="300" x2="476.3" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="476.3" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 g</text><line x1="682.5" y1="300" x2="682.5" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="682.5" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">75 g</text><line x1="888.6" y1="300" x2="888.6" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="888.6" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 g</text><line x1="1094.8" y1="300" x2="1094.8" y2="307" stroke="#5E605A" stroke-width="1.2"/><text x="1094.8" y="326" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">125 g</text><text x="64" y="500" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zusammen rund 100 g Protein und 30 g Ballaststoffe, ohne Kalorienzählen. Beispiel für 80 kg Körpergewicht, Zielbereich 1,2 bis 1,6 g Protein pro kg und Tag. Mit</text><text x="64" y="519" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tofu statt Hähnchen oder Fisch liegt das Mittagessen niedriger. Proteinwerte aus dem Bundeslebensmittelschlüssel, gerundet.</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Leidy et al., Am J Clin Nutr 2015; Bundeslebensmittelschlüssel (BLS 3.02), gerundet</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

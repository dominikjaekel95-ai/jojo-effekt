<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Liraglutid allein: 6 kg mehr Zunahme als nach Training allein</title>
<desc id="d">Punktdiagramm mit 95-Prozent-Konfidenzintervallen aus der S-LiTE-Nachbeobachtung: Im Jahr ohne Behandlung (Woche 52 bis 104) nahmen Teilnehmende nach Liraglutid allein 6,0 Kilogramm mehr zu als nach Training allein ohne Medikament (2,1 bis 10,0) und 2,5 Kilogramm mehr als nach Training plus Liraglutid (−1,5 bis 6,5, nicht signifikant). Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau ein Jahr nach Therapieende erhalten. Studienablauf: 8 Wochen kalorienarme Diät, 52 Wochen Placebo, Training, Liraglutid oder beides, danach 52 Wochen ohne Behandlung.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Liraglutid allein: 6 kg mehr Zunahme als nach Training allein</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">S-LiTE-Nachbeobachtung: Gewichtszunahme im Jahr ohne Behandlung, Liraglutid allein gegenüber den Trainingsgruppen</text>
<text x="64" y="150" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Studienablauf (Abschnitte nicht maßstäblich)</text><text x="64" y="176" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche −8 bis 0</text><text x="64" y="196" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kalorienarme Diät</text><line x1="64" y1="210" x2="406" y2="210" stroke="#5E605A" stroke-width="3" stroke-linecap="butt"/><text x="426" y="176" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 0 bis 52</text><text x="426" y="196" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo, Training, Liraglutid oder beides</text><line x1="426" y1="210" x2="768" y2="210" stroke="#141513" stroke-width="3" stroke-linecap="butt"/><text x="788" y="176" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 52 bis 104</text><text x="788" y="196" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohne jede Behandlung</text><line x1="788" y1="210" x2="1130" y2="210" stroke="#7A4718" stroke-width="3" stroke-linecap="butt"/><text x="64" y="256" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mehrzunahme nach Liraglutid allein in Woche 52 bis 104, verglichen mit …</text><line class="g" x1="440" y1="276" x2="440" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="440" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2 kg</text><line class="g" x1="530" y1="276" x2="530" y2="454" stroke="#5E605A" stroke-width="1.2"/><text x="530" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 kg</text><line class="g" x1="620" y1="276" x2="620" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="620" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+2 kg</text><line class="g" x1="710" y1="276" x2="710" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="710" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+4 kg</text><line class="g" x1="800" y1="276" x2="800" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="800" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+6 kg</text><line class="g" x1="890" y1="276" x2="890" y2="394.4" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="890" y1="425.7" x2="890" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="890" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+8 kg</text><line class="g" x1="980" y1="276" x2="980" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="980" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+10 kg</text><line class="g" x1="1070" y1="276" x2="1070" y2="304.4" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1070" y1="335.7" x2="1070" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="1070" y="478" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+12 kg</text><text x="64" y="320" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">… Training allein</text><text x="64" y="342" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI 2,1 bis 10,0 kg</text><line x1="624.5" y1="318" x2="980" y2="318" stroke="#7A4718" stroke-width="2.6"/><line x1="624.5" y1="309" x2="624.5" y2="327" stroke="#7A4718" stroke-width="2.6"/><line x1="980" y1="309" x2="980" y2="327" stroke="#7A4718" stroke-width="2.6"/><circle cx="800" cy="318" r="9" fill="#7A4718" stroke="#EFEFEB" stroke-width="2"/><text x="996" y="326" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+6,0 kg</text><text x="64" y="410" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">… Training plus Liraglutid</text><text x="64" y="432" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI −1,5 bis 6,5 kg, nicht signifikant</text><line x1="462.5" y1="408" x2="822.5" y2="408" stroke="#7A4718" stroke-width="2.6"/><line x1="462.5" y1="399" x2="462.5" y2="417" stroke="#7A4718" stroke-width="2.6"/><line x1="822.5" y1="399" x2="822.5" y2="417" stroke="#7A4718" stroke-width="2.6"/><circle cx="642.5" cy="408" r="8" fill="#EFEFEB" stroke="#7A4718" stroke-width="2.6"/><text x="838.5" y="416" font-size="22" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+2,5 kg</text><text x="64" y="520" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau ein Jahr nach Therapieende erhalten; nach Liraglutid allein kam das Gewicht zurück.</text><text x="64" y="539" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Erwachsene mit Adipositas, betreutes Trainingsprogramm; Punkt = Mittelwert (offen: nicht signifikant), Linie = 95-%-Konfidenzintervall.</text>

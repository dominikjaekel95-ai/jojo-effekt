<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Protein verteilen: gleich viel zu jeder Mahlzeit</title>
<desc id="d">Zwei Balkengruppen: gleichmäßige Verteilung mit etwa 30 Gramm Protein zu Frühstück, Mittag und Abend gegenüber abendlastiger Verteilung mit etwa 10, 15 und 65 Gramm bei gleicher Tagesmenge. Bei gleichmäßiger Verteilung lag die Muskelproteinsynthese über 24 Stunden um 25 Prozent höher. Empfehlung für Gewichtsabnahme und -erhalt: mindestens etwa 25 bis 30 Gramm Protein pro Mahlzeit.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein verteilen: gleich viel zu jeder Mahlzeit</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gleiche Tagesmenge, zwei Verteilungen; Muskelproteinsynthese über 24 Stunden bei gesunden Erwachsenen</text>
<text x="64" y="168" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gleichmäßig</text><text x="64" y="192" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">etwa 30 g pro Mahlzeit</text><line x1="64" y1="470" x2="404" y2="470" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="74" y="363.8" width="90" height="106.2" rx="1" fill="#141513"/><text x="119" y="351.8" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30 g</text><text x="119" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Frühstück</text><rect class="mk" x="189" y="363.8" width="90" height="106.2" rx="1" fill="#141513"/><text x="234" y="351.8" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30 g</text><text x="234" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittag</text><rect class="mk" x="304" y="363.8" width="90" height="106.2" rx="1" fill="#141513"/><text x="349" y="351.8" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30 g</text><text x="349" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Abend</text><text x="470" y="168" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Abendlastig</text><text x="470" y="192" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">etwa 10, 15 und 65 g</text><line x1="470" y1="470" x2="810" y2="470" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="480" y="434.6" width="90" height="35.4" rx="1" fill="#141513"/><text x="525" y="422.6" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">10 g</text><text x="525" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Frühstück</text><rect class="mk" x="595" y="416.9" width="90" height="53.1" rx="1" fill="#141513"/><text x="640" y="404.9" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">15 g</text><text x="640" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittag</text><rect class="mk" x="710" y="240" width="90" height="230" rx="1" fill="#141513"/><text x="755" y="228" font-size="19" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">65 g</text><text x="755" y="494" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Abend</text><line x1="860" y1="150" x2="860" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="896" y="300" font-size="64" font-weight="500" fill="#2E5944" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+25 %</text><text x="896" y="338" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Muskelproteinsynthese</text><text x="896" y="364" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">über 24 Stunden bei</text><text x="896" y="385" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gleichmäßiger Verteilung,</text><text x="896" y="406" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gegenüber abendlastig</text><text x="64" y="548" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kleine Studie; gemessen wurde die Muskelproteinsynthese, nicht die Muskelmasse. Empfehlung für Gewichtsabnahme und -erhalt: mindestens etwa 25 bis 30 g</text><text x="64" y="567" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein pro Mahlzeit.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Mamerow et al., J Nutr 2014;144(6):876–880; Leidy et al., Am J Clin Nutr 2015</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Training vor dem Absetzen: 6 kg Unterschied ein Jahr später</title>
<desc id="d">Balkendiagramm aus der S-LiTE-Nachbeobachtung: Im Jahr nach Therapieende nahmen Teilnehmende nach Liraglutid allein 6,0 Kilogramm mehr zu als nach dem Trainingsprogramm (95-Prozent-Konfidenzintervall 2,1 bis 10,0) und 2,5 Kilogramm mehr als nach Training plus Liraglutid (−1,5 bis 6,5, nicht signifikant). Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau erhalten.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Training vor dem Absetzen: 6 kg Unterschied ein Jahr später</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >S-LiTE-Nachbeobachtung: Gewichtszunahme im Jahr nach Therapieende, Liraglutid allein gegenüber den Trainingsgruppen</text>
<rect x="56" y="130" width="344" height="58" rx="10" fill="#edebe6"/><text x="72" y="154" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" >8 Wochen</text><text x="72" y="176" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >kalorienarme Diät</text><polygon points="404,152 422,159 404,166" fill="#6f6f6f"/><rect x="428" y="130" width="344" height="58" rx="10" fill="#edebe6"/><text x="444" y="154" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" >52 Wochen Behandlung</text><text x="444" y="176" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >Placebo, Training, Liraglutid oder beides</text><polygon points="776,152 794,159 776,166" fill="#6f6f6f"/><rect x="800" y="130" width="344" height="58" rx="10" fill="#edebe6"/><text x="816" y="154" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" >52 Wochen</text><text x="816" y="176" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start" >ohne jede Behandlung</text><text x="56" y="232" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="start" >Mehr-Zunahme nach Liraglutid allein im Jahr ohne Behandlung, verglichen mit …</text><line x1="380" y1="250" x2="380" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="380" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >−2 kg</text><line x1="485.7142857142857" y1="250" x2="485.7142857142857" y2="470" stroke="#6f6f6f" stroke-width="1.5"/><text x="485.7142857142857" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >0 kg</text><line x1="591.4285714285714" y1="250" x2="591.4285714285714" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="591.4285714285714" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+2 kg</text><line x1="697.1428571428571" y1="250" x2="697.1428571428571" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="697.1428571428571" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+4 kg</text><line x1="802.8571428571429" y1="250" x2="802.8571428571429" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="802.8571428571429" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+6 kg</text><line x1="908.5714285714286" y1="250" x2="908.5714285714286" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="908.5714285714286" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+8 kg</text><line x1="1014.2857142857142" y1="250" x2="1014.2857142857142" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="1014.2857142857142" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+10 kg</text><line x1="1120" y1="250" x2="1120" y2="470" stroke="#dedbd4" stroke-width="1"/><text x="1120" y="492" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >+12 kg</text><text x="56" y="307" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" >… Training allein</text><rect x="485.7142857142857" y="285" width="317.14285714285717" height="34" rx="6" fill="#a35f4d" /><line x1="596.7142857142857" y1="302" x2="1014.2857142857142" y2="302" stroke="#1a1a1a" stroke-width="2"/><line x1="596.7142857142857" y1="292" x2="596.7142857142857" y2="312" stroke="#1a1a1a" stroke-width="2"/><line x1="1014.2857142857142" y1="292" x2="1014.2857142857142" y2="312" stroke="#1a1a1a" stroke-width="2"/><text x="493.7142857142857" y="345" font-size="15" font-weight="600" fill="#a35f4d" text-anchor="start" >+6,0 kg (95-%-KI 2,1 bis 10,0)</text><text x="56" y="402" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" >… Training plus Liraglutid</text><rect x="485.7142857142857" y="380" width="132.14285714285717" height="34" rx="6" fill="#f3e4df" stroke="#a35f4d" stroke-width="1.5"/><line x1="406.42857142857144" y1="397" x2="829.2857142857142" y2="397" stroke="#1a1a1a" stroke-width="2"/><line x1="406.42857142857144" y1="387" x2="406.42857142857144" y2="407" stroke="#1a1a1a" stroke-width="2"/><line x1="829.2857142857142" y1="387" x2="829.2857142857142" y2="407" stroke="#1a1a1a" stroke-width="2"/><text x="493.7142857142857" y="440" font-size="15" font-weight="600" fill="#a35f4d" text-anchor="start" >+2,5 kg (95-%-KI −1,5 bis 6,5; nicht signifikant)</text><text x="56" y="540" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau ein Jahr nach Therapieende erhalten; nach Liraglutid allein kam das Gewicht zurück.</text><text x="56" y="566" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Erwachsene mit Adipositas, betreutes Trainingsprogramm; schwarze Linie = 95-%-Konfidenzintervall.</text>

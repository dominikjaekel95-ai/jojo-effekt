<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Nach der letzten Dosis: vier Phasen</title>
<desc id="d">Vier Phasen nach der letzten Dosis einer Abnehmspritze: Woche 1 bis 2 noch wenig Veränderung, Woche 2 bis 5 kehrt der Appetit zurück, Woche 5 bis 8 ist der Wirkstoff praktisch abgebaut, ab Woche 8 ist die Gewichtszunahme messbar und steigt bis etwa Woche 20.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#22201c" text-anchor="start" >Nach der letzten Dosis: vier Phasen</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4a463f" text-anchor="start" >Der typische Verlauf, wie er aus Pharmakologie und Studien ableitbar ist</text>
<rect x="56" y="160" width="250" height="330" rx="14" fill="#f7f2ea"/><rect x="56" y="160" width="250" height="10" rx="5" fill="#2f6b5a"/><text x="76" y="210" font-size="16" font-weight="600" fill="#2f6b5a" text-anchor="start" >Woche 1 bis 2</text><text x="76" y="250" font-size="21" font-weight="700" fill="#22201c" text-anchor="start" >Noch wenig Veränderung</text><text x="76" y="300" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Genug Wirkstoff im Körper;</text><text x="76" y="326" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >viele merken keinen Unterschied.</text><polygon points="312,320 326,330 312,340" fill="#6b665d"/><rect x="330" y="160" width="250" height="330" rx="14" fill="#f7f2ea"/><rect x="330" y="160" width="250" height="10" rx="5" fill="#b8563e"/><text x="350" y="210" font-size="16" font-weight="600" fill="#b8563e" text-anchor="start" >Woche 2 bis 5</text><text x="350" y="250" font-size="21" font-weight="700" fill="#22201c" text-anchor="start" >Der Appetit kommt zurück</text><text x="350" y="300" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Wirkstoffspiegel sinkt, Magen arbeitet</text><text x="350" y="326" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >schneller, Sättigung kommt später.</text><polygon points="586,320 600,330 586,340" fill="#6b665d"/><rect x="604" y="160" width="250" height="330" rx="14" fill="#f7f2ea"/><rect x="604" y="160" width="250" height="10" rx="5" fill="#6b665d"/><text x="624" y="210" font-size="16" font-weight="600" fill="#6b665d" text-anchor="start" >Woche 5 bis 8</text><text x="624" y="250" font-size="21" font-weight="700" fill="#22201c" text-anchor="start" >Wirkstoff praktisch weg</text><text x="624" y="300" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Nach etwa fünf Halbwertszeiten</text><text x="624" y="326" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >weitgehend abgebaut.</text><polygon points="860,320 874,330 860,340" fill="#6b665d"/><rect x="878" y="160" width="250" height="330" rx="14" fill="#f7f2ea"/><rect x="878" y="160" width="250" height="10" rx="5" fill="#b8563e"/><text x="898" y="210" font-size="16" font-weight="600" fill="#b8563e" text-anchor="start" >Ab Woche 8</text><text x="898" y="250" font-size="21" font-weight="700" fill="#22201c" text-anchor="start" >Zunahme messbar</text><text x="898" y="300" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >In Studien ab Woche 8 signifikant,</text><text x="898" y="326" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Anstieg bis etwa Woche 20.</text><text x="56" y="540" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Halbwertszeiten laut Fachinformation (Semaglutid etwa eine Woche, Tirzepatid etwa fünf Tage); Zunahme laut Meta-Analyse randomisierter Studien.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#e2dace" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Quelle: Fachinformationen Wegovy und Mounjaro (EMA); Wu et al., Meta-Analyse, BMC Medicine 2025</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="end" >nachderspritze.de</text>
</svg>

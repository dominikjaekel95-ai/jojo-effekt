cing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Linsen, gekocht</text><text x="200" y="183" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">150 g</text><rect class="mk" x="470" y="165" width="480" height="22" rx="1" fill="#2E5944"/><text x="960" y="184" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8 g</text><text x="64" y="223" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vollkornbrot</text><text x="175" y="223" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2 Scheiben (100 g)</text><rect class="mk" x="470" y="205" width="480" height="22" rx="1" fill="#2E5944"/><text x="960" y="224" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8 g</text><text x="64" y="263" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Himbeeren</text><text x="163.7" y="263" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">125 g</text><rect class="mk" x="470" y="245" width="360" height="22" rx="1" fill="#2E5944"/><text x="840" y="264" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6 g</text><text x="64" y="303" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Brokkoli, gegart</text><text x="200.4" y="303" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">200 g</text><rect class="mk" x="470" y="285" width="360" height="22" rx="1" fill="#2E5944"/><text x="840" y="304" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6 g</text><text x="64" y="343" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Haferflocken</text><text x="178.8" y="343" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 g</text><rect class="mk" x="470" y="325" width="300" height="22" rx="1" fill="#2E5944"/><text x="780" y="344" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5 g</text><text x="64" y="383" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leinsamen, geschrotet</text><text x="257.7" y="383" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 EL (10 g)</text><rect class="mk" x="470" y="365" width="240" height="22" rx="1" fill="#2E5944"/><text x="720" y="384" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4 g</text><text x="64" y="423" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Glucomannan</text><text x="190.6" y="423" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tagesmenge laut Angabe</text><rect class="mk" x="470" y="405" width="180" height="22" rx="1" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><text x="660" y="424" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 g</text><text x="64" y="462" font-size="14" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Richtwert: mindestens 30 g am Tag</text><rect x="64" y="474" width="21" height="21" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><rect x="90" y="474" width="21" height="21" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><rect x="116" y="474" width="21" height="21" rx="2" fill="#E5E5DF" stroke="#141513" stroke-width="1.6"/><rect x="142" y="474" width="21" height="21" rx="2" fill="#2E5944"/><re
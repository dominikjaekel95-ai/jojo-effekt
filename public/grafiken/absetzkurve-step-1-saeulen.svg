<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was nach dem Absetzen bleibt: ein Drittel</title>
<desc id="d">Zwei Säulen: Nach 68 Wochen Semaglutid sind im Mittel 17,3 Prozent des Gewichts verloren. Ein Jahr nach dem Absetzen sind 11,6 Prozentpunkte wieder zurück, 5,6 Prozent bleiben; das entspricht zwei Dritteln des Verlusts, die zurückkommen.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was nach dem Absetzen bleibt: ein Drittel</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP-1-Verlängerung: 68 Wochen Semaglutid, danach 52 Wochen ohne Medikament</text>
<text x="64" y="146" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittlere Gewichtsänderung gegenüber dem Start, Semaglutid-Gruppe der STEP-1-Verlängerung</text><line class="g" x1="230" y1="180" x2="850" y2="180" stroke="#5E605A" stroke-width="1.2"/><text x="216" y="185" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line class="g" x1="230" y1="259" x2="850" y2="259" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="264" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><line class="g" x1="230" y1="338" x2="850" y2="338" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="343" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><line class="g" x1="230" y1="417" x2="850" y2="417" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="422" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−15 %</text><line class="g" x1="230" y1="496" x2="339.9" y2="496" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="460.1" y1="496" x2="850" y2="496" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="501" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−20 %</text><rect class="mk" x="300" y="180" width="200" height="273.3" rx="2" fill="#141513"/><text x="400" y="437.3" font-size="16" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" class="in">verloren</text><text x="400" y="491.3" font-size="30" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−17,3 %</text><rect class="mk" x="640" y="180" width="200" height="88.5" rx="2" fill="#141513"/><rect class="mk" x="640" y="268.5" width="200" height="184.9" rx="2" fill="#7A4718"/><text x="740" y="232.2" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−5,6 % bleibt</text><text x="740" y="350.9" font-size="30" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+11,6</text><text x="740" y="376.9" font-size="16" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" class="in">Prozentpunkte</text><text x="740" y="396.9" font-size="16" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" class="in">wieder zurück</text><path d="M858 268.5 H866 V453.3 H858" fill="none" stroke="#7A4718" stroke-width="1.6"/><rect x="877" y="339.9" width="109.4" height="11.2" rx="2" fill="#E8CF55"/><text x="882" y="348.9" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em">zwei Drittel</text><text x="882" y="372.9" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">des Verlusts</text><text x="882" y="396.9" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">zurück</text><text x="400" y="540" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach 68 Wochen Semaglutid</text><text x="400" y="562" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(Woche 68, Ende der Behandlung)</text><text x="740" y="540" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ein Jahr nach dem Absetzen</text><text x="740" y="562" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(Woche 120, ohne Medikament)</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Wilding et al., STEP-1-Verlängerung, Diabetes Obes Metab 2022;24(8):1553–1564</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>

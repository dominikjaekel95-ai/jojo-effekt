<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie viel vom verlorenen Gewicht Fett war</title>
<desc id="d">Zwei Balken, die den Gewichtsverlust aufteilen: In der STEP-1-Substudie mit Semaglutid entfielen rund 60 Prozent auf Fettmasse und rund 40 Prozent auf fettfreie Masse, in der SURMOUNT-1-Substudie mit Tirzepatid rund 75 Prozent auf Fettmasse und rund 25 Prozent auf fettfreie Masse. Unter Tirzepatid sanken Körpergewicht um 21,3 Prozent, Fettmasse um 33,9 Prozent und fettfreie Masse um 10,9 Prozent (Placebo 5,3, 8,2 und 2,6 Prozent). Zwei verschiedene Studien, kein direkter Vergleich.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wie viel vom verlorenen Gewicht Fett war</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteile am Gewichtsverlust in zwei DXA-Substudien: Semaglutid in STEP 1, Tirzepatid in SURMOUNT-1</text>
<text x="64" y="180" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP 1, Semaglutid</text><text x="254.7" y="180" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DXA-Substudie mit 140 Teilnehmenden, 68 Wochen</text><rect class="mk" x="64" y="198" width="643.2" height="92" rx="3" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><rect class="mk" x="707.2" y="198" width="428.8" height="92" rx="3" fill="#2E5944"/><text x="86" y="246" font-size="30" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 60 %</text><text x="86" y="272" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">Fettmasse</text><text x="729.2" y="246" font-size="30" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 40 %</text><text x="729.2" y="272" font-size="17" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">fettfreie Masse</text><text x="64" y="340" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SURMOUNT-1, Tirzepatid</text><text x="309.2" y="340" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DXA-Substudie mit 160 Teilnehmenden, 72 Wochen</text><rect class="mk" x="64" y="358" width="804" height="92" rx="3" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><rect class="mk" x="868" y="358" width="268" height="92" rx="3" fill="#2E5944"/><text x="86" y="406" font-size="30" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 75 %</text><text x="86" y="432" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">Fettmasse</text><text x="890" y="406" font-size="30" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 25 %</text><text x="890" y="432" font-size="17" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">fettfreie Masse</text><text x="64" y="494" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SURMOUNT-1 unter Tirzepatid: Körpergewicht −21,3 %, Fettmasse −33,9 %, fettfreie Masse −10,9 % (Placebo −5,3 %, −8,2 %, −2,6 %); das</text><text x="64" y="516" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verhältnis von Fett zu fettfreier Masse war unter Tirzepatid und Placebo ähnlich.</text><text x="64" y="558" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fettfreie Masse heißt Muskeln, Organe, Knochen, Wasser. Zwei verschiedene Studien, kein direkter Vergleich der Wirkstoffe; Anteile gerundet.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Wilding et al., STEP 1 body composition, J Endocr Soc 2021; Look et al., SURMOUNT-1, Diabetes Obes Metab 2025</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

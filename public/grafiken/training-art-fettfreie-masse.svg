<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Kraft oder Ausdauer: fettfreie Masse und Knochen beim Abnehmen</title>
<desc id="d">Zwei Balkengruppen aus einer randomisierten Studie mit 160 Erwachsenen ab 65 Jahren mit Adipositas, 26 Wochen Diät und im Mittel 9 Prozent Gewichtsverlust: Verlust an fettfreier Masse mit Krafttraining 1,0 Kilogramm, mit Kraft plus Ausdauer 1,7 Kilogramm, mit Ausdauertraining 2,7 Kilogramm. Knochendichte der Hüfte: minus 2,6 Prozent mit Ausdauertraining, minus 1,1 Prozent mit Kraft plus Ausdauer, mit Krafttraining weniger als 1 Prozent und nicht signifikant.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="31.5" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kraft oder Ausdauer: fettfreie Masse und Knochen beim Abnehmen</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Randomisierte Studie: 160 Erwachsene ab 65 Jahren mit Adipositas, 26 Wochen Diät, Gewicht im Mittel −9 %</text>
<text x="64" y="168" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verlust an fettfreier Masse</text><line x1="290" y1="190" x2="290" y2="386" stroke="#5E605A" stroke-width="1.2"/><text x="64" y="228" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Krafttraining</text><rect class="mk" x="290" y="209" width="76.7" height="26" rx="1" fill="#2E5944"/><text x="376.7" y="230" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1,0 kg</text><text x="64" y="290" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kraft plus Ausdauer</text><rect class="mk" x="290" y="271" width="130.3" height="26" rx="1" fill="#2E5944"/><text x="430.3" y="292" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1,7 kg</text><text x="64" y="352" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausdauertraining</text><rect class="mk" x="290" y="333" width="207" height="26" rx="1" fill="#2E5944"/><text x="507" y="354" font-size="22" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2,7 kg</text><line x1="616" y1="150" x2="616" y2="404" stroke="#D3D4CD" stroke-width="1"/><text x="650" y="168" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Knochendichte der Hüfte</text><line x1="860" y1="190" x2="860" y2="386" stroke="#5E605A" stroke-width="1.2"/><text x="650" y="228" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Krafttraining</text><rect class="mk" x="860" y="209" width="66.7" height="26" rx="2" fill="none" stroke="#5E605A" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="936.7" y="228" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 1 %, n. s.</text><text x="650" y="290" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kraft plus Ausdauer</text><rect class="mk" x="860" y="271" width="73.3" height="26" rx="1" fill="#141513"/><text x="943.3" y="292" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1,1 %</text><text x="650" y="352" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausdauertraining</text><rect class="mk" x="860" y="333" width="173.3" height="26" rx="1" fill="#141513"/><text x="1043.3" y="354" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2,6 %</text><line x1="64" y1="436" x2="1136" y2="436" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="474" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Bei gleicher Diät verlor die Krafttrainingsgruppe am wenigsten fettfreie Masse; die Knochendichte der Hüfte sank mit</text><text x="64" y="500" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausdauertraining am stärksten, mit Krafttraining um weniger als 1 %.</text><text x="64" y="558" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Beide Geschlechter; fettfreie Masse in kg, Knochendichte in Prozent gegenüber dem Start; n. s. = nicht signifikant.</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Villareal et al., NEJM 2017;376(20):1943–1955</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

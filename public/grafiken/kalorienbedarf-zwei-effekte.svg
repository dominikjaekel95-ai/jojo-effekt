<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum nach dem Abnehmen weniger Energie gebraucht wird</title>
<desc id="d">Wasserfalldiagramm für eine Frau mit 45 Jahren und 170 Zentimetern: Vor dem Abnehmen mit 95 Kilogramm liegt der Tagesbedarf laut Formel bei 2.277 kcal. Der leichtere Körper senkt ihn um 210 kcal auf 2.067 kcal bei 80 Kilogramm. Die Anpassung nach Gewichtsverlust senkt den tatsächlichen Verbrauch um weitere 300 bis 400 kcal, auf eher rund 1.700 bis 1.800 kcal. Formel nach Mifflin-St-Jeor mal Aktivitätsfaktor 1,4, gerundet; die Anpassung ist individuell verschieden.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Warum nach dem Abnehmen weniger Energie gebraucht wird</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Rechenbeispiel: Frau, 45 Jahre, 170 cm, von 95 auf 80 kg; Tagesbedarf in kcal bei Aktivitätsfaktor 1,4</text>
<line x1="120" y1="500" x2="1136" y2="500" stroke="#5E605A" stroke-width="1.2"/><text x="106" y="505" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text><line x1="120" y1="440" x2="1136" y2="440" stroke="#D3D4CD" stroke-width="1"/><text x="106" y="445" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">500</text><line x1="120" y1="380" x2="1136" y2="380" stroke="#D3D4CD" stroke-width="1"/><text x="106" y="385" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.000</text><line x1="120" y1="320" x2="1136" y2="320" stroke="#D3D4CD" stroke-width="1"/><text x="106" y="325" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.500</text><line x1="120" y1="260" x2="1136" y2="260" stroke="#D3D4CD" stroke-width="1"/><text x="106" y="265" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.000</text><line x1="120" y1="200" x2="1136" y2="200" stroke="#D3D4CD" stroke-width="1"/><text x="106" y="205" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.500</text><rect class="mk" x="135" y="226.8" width="130" height="273.2" rx="1" fill="#141513"/><text x="200" y="214.8" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.277 kcal</text><line x1="265" y1="226.8" x2="335" y2="226.8" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="335" y="226.8" width="130" height="25.2" rx="1" fill="#E5E5DF" stroke="#5E605A" stroke-width="1.4"/><text x="400" y="214.8" font-size="18" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−210 kcal</text><line x1="465" y1="252" x2="535" y2="252" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="535" y="252" width="130" height="248" rx="1" fill="#141513"/><text x="600" y="240" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.067 kcal</text><line x1="665" y1="252" x2="735" y2="252" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="735" y="252" width="130" height="36" rx="1" fill="#7A4718"/><rect class="mk" x="735" y="288" width="130" height="12" rx="1" fill="none" stroke="#7A4718" stroke-width="1.6" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="800" y="240" font-size="18" font-weight="560" fill="#7A4718" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−300 bis 400 kcal</text><line x1="865" y1="288" x2="935" y2="288" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="935" y="300" width="130" height="200" rx="1" fill="#141513"/><rect class="mk" x="935" y="288" width="130" height="12" rx="1" fill="none" stroke="#141513" stroke-width="1.6" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="1000" y="254" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rund 1.700 bis</text><text x="1000" y="276" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.800 kcal</text><text x="200" y="524" font-size="15" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vorher</text><text x="200" y="543" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95 kg</text><text x="400" y="524" font-size="15" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leichterer</text><text x="400" y="543" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körper</text><text x="600" y="524" font-size="15" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Formel</text><text x="600" y="543" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">für 80 kg</text><text x="800" y="524" font-size="15" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anpassung</text><text x="800" y="543" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach Abnehmen</text><text x="1000" y="524" font-size="15" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eher</text><text x="1000" y="543" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">tatsächlich</text><text x="64" y="596" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Formel: Mifflin-St-Jeor mal 1,4, eigene Rechnung, gerundet. Anpassung: Messwerte nach 10 % Gewichtsverlust, individuell verschieden.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Mifflin et al., Am J Clin Nutr 1990; DGE-Referenzwerte Energie; Leibel et al., NEJM 1995; Rosenbaum und Leibel, Int J Obes 2010</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was beim Abnehmen mit Semaglutid verloren geht</title>
<desc id="d">Balken, der den Gewichtsverlust unter Semaglutid aufteilt: rund 60 Prozent Fettmasse und rund 40 Prozent fettfreie Masse, also Muskeln, Organe, Knochen und Wasser; wie viel davon Muskel war, wurde nicht getrennt gemessen. Krafttraining an mindestens zwei Tagen pro Woche und 1,2 bis 1,6 Gramm Protein pro Kilogramm am Tag halten den Anteil in Studien klein.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was beim Abnehmen mit Semaglutid verloren geht</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil am Gewichtsverlust nach 68 Wochen, STEP-1-Substudie mit DXA-Messung</text>
<text x="64" y="184" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil am verlorenen Gewicht</text><rect class="mk" x="64" y="200" width="643.2" height="104" rx="3" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><rect class="mk" x="707.2" y="200" width="428.8" height="104" rx="3" fill="#2E5944"/><text x="88" y="254" font-size="34" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 60 %</text><text x="88" y="282" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">Fettmasse</text><text x="731.2" y="254" font-size="34" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 40 %</text><text x="731.2" y="282" font-size="18" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">fettfreie Masse</text><line x1="64" y1="310" x2="64" y2="320" stroke="#5E605A" stroke-width="1"/><line x1="171.2" y1="310" x2="171.2" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="278.4" y1="310" x2="278.4" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="385.6" y1="310" x2="385.6" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="492.8" y1="310" x2="492.8" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="600" y1="310" x2="600" y2="320" stroke="#5E605A" stroke-width="1"/><line x1="707.2" y1="310" x2="707.2" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="814.4" y1="310" x2="814.4" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="921.6" y1="310" x2="921.6" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="1028.8" y1="310" x2="1028.8" y2="315" stroke="#5E605A" stroke-width="1"/><line x1="1136" y1="310" x2="1136" y2="320" stroke="#5E605A" stroke-width="1"/><text x="64" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><text x="278.4" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">20 %</text><text x="492.8" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">40 %</text><text x="707.2" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">60 %</text><text x="921.6" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">80 %</text><text x="1136" y="340" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 %</text><text x="64" y="402" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fettfreie Masse heißt: Muskeln, Organe, Knochen, Wasser. Wie viel davon Muskel war, wurde nicht getrennt gemessen.</text><text x="64" y="442" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was den Anteil klein hält, ist in Studien belegt: Krafttraining an mindestens zwei Tagen pro Woche und 1,2 bis 1,6 g Protein pro kg</text><text x="64" y="469" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht am Tag.</text><text x="64" y="511" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DXA-Substudie mit 140 Teilnehmenden, exploratorische Analyse; Anteile gerundet.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Wilding et al., STEP 1 body composition, J Endocr Soc 2021; Sardeli et al. 2018; Leidy et al. 2015; WHO 2020</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wo die Versorgung in Deutschland ohnehin knapp ist</title>
<desc id="d">Balkendiagramm zur Versorgung Erwachsener in Deutschland: Unter der Zufuhrempfehlung lagen bei Magnesium 26 Prozent der Männer und 29 Prozent der Frauen, bei Eisen 14 Prozent der Männer und 58 Prozent der Frauen (Nationale Verzehrsstudie II). Beim Vitamin-D-Wert im Blut lagen 30,2 Prozent unter 30 Nanomol pro Liter (Mangel) und 61,6 Prozent unter 50 Nanomol pro Liter (DEGS1). Erhoben vor der Zeit der GLP-1-Medikamente.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wo die Versorgung in Deutschland ohnehin knapp ist</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil der Erwachsenen unter der Zufuhrempfehlung bzw. mit niedrigem Vitamin-D-Wert im Blut</text>
<line x1="400" y1="186" x2="400" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="400" y="516" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line x1="560" y1="186" x2="560" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="560" y="516" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">25 %</text><line x1="720" y1="186" x2="720" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="720" y="516" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 %</text><line x1="880" y1="186" x2="880" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="880" y="516" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">75 %</text><line x1="1040" y1="186" x2="1040" y2="492" stroke="#D3D4CD" stroke-width="1"/><text x="1040" y="516" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 %</text><text x="64" y="172" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zufuhr unter der Empfehlung</text><text x="330.3" y="172" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nationale Verzehrsstudie II</text><text x="64" y="211" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Magnesium, Männer</text><rect class="mk" x="400" y="195" width="166.4" height="22" rx="1" fill="#141513"/><text x="576.4" y="213" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">26 %</text><text x="64" y="251" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Magnesium, Frauen</text><rect class="mk" x="400" y="235" width="185.6" height="22" rx="1" fill="#141513"/><text x="595.6" y="253" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">29 %</text><text x="64" y="291" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eisen, Männer</text><rect class="mk" x="400" y="275" width="89.6" height="22" rx="1" fill="#141513"/><text x="499.6" y="293" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">14 %</text><text x="64" y="331" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eisen, Frauen</text><rect class="mk" x="400" y="315" width="371.2" height="22" rx="1" fill="#141513"/><text x="781.2" y="333" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">58 %</text><text x="64" y="392" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vitamin-D-Wert im Blut</text><text x="283" y="392" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gesundheitsstudie DEGS1</text><text x="64" y="431" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 30 nmol/l (Mangel)</text><rect class="mk" x="400" y="415" width="193.3" height="22" rx="1" fill="#141513"/><text x="603.3" y="433" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30,2 %</text><text x="64" y="471" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 50 nmol/l</text><rect class="mk" x="400" y="455" width="394.2" height="22" rx="1" fill="#141513"/><text x="804.2" y="473" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">61,6 %</text><text x="64" y="554" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Erhoben vor der Zeit der GLP-1-Medikamente; Vitamin D im Winter deutlich niedriger als im Sommer. Wer unter der Spritze kleine Portionen isst, startet von dieser</text><text x="64" y="573" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausgangslage.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Max Rubner-Institut, Nationale Verzehrsstudie II, 2008; Rabenberg et al., DEGS1, BMC Public Health 2015</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

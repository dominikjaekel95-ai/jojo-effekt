ein Zehntel</text><text x="64" y="524" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1 Kästchen = 1 g; Werte aus dem Bundeslebensmittelschlüssel, gerundet. Die Angabe zu Glucomannan gilt für 3 g am Tag in drei Portionen zu je 1 g mit ein bis</text><text x="64" y="543" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">zwei Gläsern Wasser vor den Mahlzeiten, bei kalorienarmer Ernährung; nie ohne reichlich Wasser (Erstickungsgefahr).</text>

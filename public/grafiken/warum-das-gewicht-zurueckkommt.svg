<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum das Gewicht nach dem Absetzen zurückkommt</title>
<desc id="d">Vier Karten mit den Mechanismen des Jojo-Effekts nach der Abnehmspritze: Die Appetitbremse fällt nach fünf bis sieben Wochen weg; die Hungerhormone Ghrelin und Leptin bleiben noch ein Jahr nach einer Diät verschoben; der Ruheenergieverbrauch blieb in einer Studie sechs Jahre nach starkem Gewichtsverlust abgesenkt; rund 40 Prozent des Gewichtsverlusts unter Semaglutid entfielen auf fettfreie Masse.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#22201c" text-anchor="start" >Warum das Gewicht nach dem Absetzen zurückkommt</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4a463f" text-anchor="start" >Vier belegte Mechanismen hinter dem Jojo-Effekt nach der Abnehmspritze</text>
<rect x="56" y="150" width="250" height="400" rx="14" fill="#f7f2ea"/><text x="181" y="215" font-size="26" font-weight="700" fill="#2f6b5a" text-anchor="middle" >5–7 Wochen</text><line x1="80" y1="240" x2="282" y2="240" stroke="#e2dace" stroke-width="1.5"/><text x="80" y="280" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Die Appetitbremse fällt</text><text x="80" y="304" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >weg</text><text x="80" y="345" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Nach etwa fünf Halbwertszeiten ist der</text><text x="80" y="369" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Wirkstoff weitgehend abgebaut.</text><text x="80" y="520" font-size="12" font-weight="400" fill="#6b665d" text-anchor="start" >Fachinformationen (EMA)</text><rect x="330" y="150" width="250" height="400" rx="14" fill="#f7f2ea"/><text x="455" y="215" font-size="26" font-weight="700" fill="#2f6b5a" text-anchor="middle" >Ghrelin ↑ Leptin ↓</text><line x1="354" y1="240" x2="556" y2="240" stroke="#e2dace" stroke-width="1.5"/><text x="354" y="280" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Hungerhormone bleiben verschoben</text><text x="354" y="304" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" ></text><text x="354" y="345" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Noch ein Jahr nach einer Diät messbar:</text><text x="354" y="369" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >mehr Hunger, weniger Sättigung.</text><text x="354" y="520" font-size="12" font-weight="400" fill="#6b665d" text-anchor="start" >Sumithran et al., NEJM 2011</text><rect x="604" y="150" width="250" height="400" rx="14" fill="#f7f2ea"/><text x="729" y="215" font-size="26" font-weight="700" fill="#2f6b5a" text-anchor="middle" >6 Jahre</text><line x1="628" y1="240" x2="830" y2="240" stroke="#e2dace" stroke-width="1.5"/><text x="628" y="280" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Weniger Energie in</text><text x="628" y="304" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Ruhe</text><text x="628" y="345" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Der Ruheenergieverbrauch blieb nach</text><text x="628" y="369" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >starkem Gewichtsverlust abgesenkt.</text><text x="628" y="520" font-size="12" font-weight="400" fill="#6b665d" text-anchor="start" >Fothergill et al., Obesity 2016</text><rect x="878" y="150" width="250" height="400" rx="14" fill="#f7f2ea"/><text x="1003" y="215" font-size="26" font-weight="700" fill="#b8563e" text-anchor="middle" >rund 40 %</text><line x1="902" y1="240" x2="1104" y2="240" stroke="#e2dace" stroke-width="1.5"/><text x="902" y="280" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Ein Teil des</text><text x="902" y="304" font-size="18" font-weight="700" fill="#22201c" text-anchor="start" >Verlusts war Muskel</text><text x="902" y="345" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >des Gewichtsverlusts unter Semaglutid</text><text x="902" y="369" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >entfielen auf fettfreie Masse.</text><text x="902" y="520" font-size="12" font-weight="400" fill="#6b665d" text-anchor="start" >STEP-1-DXA-Substudie 2021</text><text x="56" y="590" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Vier Mechanismen, die zusammen den Jojo-Effekt erklären. Was dagegen belegt ist: Krafttraining, Protein, feste Mahlzeiten.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#e2dace" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Quelle: Fachinformationen (EMA); Sumithran et al., NEJM 2011; Fothergill et al., Obesity 2016; Wilding et al., J Endocr Soc 2021</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="end" >nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Gewichtsverlust bei Typ-2-Diabetes: zwei Dosen Semaglutid</title>
<desc id="d">Balkendiagramm aus der Studie STEP 2 mit Menschen mit Typ-2-Diabetes: Nach 68 Wochen lag das Gewicht unter Semaglutid 2,4 Milligramm (Dosis wie bei Wegovy) im Mittel 9,6 Prozent niedriger, unter 1,0 Milligramm (Dosis wie bei Ozempic) 7,0 Prozent und unter Placebo 3,4 Prozent. Weniger Verlust heißt weniger, das nach dem Absetzen zurückkommen kann.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewichtsverlust bei Typ-2-Diabetes: zwei Dosen Semaglutid</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP 2: mittlere Änderung des Körpergewichts nach 68 Wochen, Erwachsene mit Übergewicht und Typ-2-Diabetes</text>
<line x1="200" y1="220" x2="900" y2="220" stroke="#5E605A" stroke-width="1.2"/><text x="186" y="225" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line x1="200" y1="345" x2="900" y2="345" stroke="#D3D4CD" stroke-width="1"/><text x="186" y="350" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><line x1="200" y1="470" x2="900" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="186" y="475" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><text x="310" y="178" font-size="17" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid 2,4 mg</text><text x="310" y="200" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Dosis wie bei Wegovy</text><rect class="mk" x="230" y="220" width="160" height="240" rx="1" fill="#141513"/><text x="310" y="500" font-size="30" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−9,6 %</text><text x="550" y="178" font-size="17" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid 1,0 mg</text><text x="550" y="200" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Dosis wie bei Ozempic</text><rect class="mk" x="470" y="220" width="160" height="175" rx="1" fill="#141513"/><text x="550" y="435" font-size="30" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−7,0 %</text><text x="790" y="178" font-size="17" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo</text><text x="790" y="200" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vergleichsgruppe</text><rect class="mk" x="710" y="220" width="160" height="85" rx="2" fill="#E5E5DF" stroke="#878982" stroke-width="1.6" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="790" y="345" font-size="30" font-weight="560" fill="#5E605A" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−3,4 %</text><text x="950" y="250" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zum Einordnen</text><text x="950" y="278" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weniger Verlust heißt</text><text x="950" y="299" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">weniger, das nach dem</text><text x="950" y="320" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Absetzen zurückkommen</text><text x="950" y="341" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kann. Am Mechanismus</text><text x="950" y="362" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ändert das nichts.</text><text x="64" y="590" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittelwerte nach 68 Wochen; randomisierte, placebokontrollierte Studie.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Davies et al., STEP 2, Lancet 2021;397(10278):971–984</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum das Gewicht nach dem Absetzen zurückkommt</title>
<desc id="d">Vier Spalten mit den Mechanismen des Jojo-Effekts, nach Gewichtsverlust belegt und auf die Zeit nach der Abnehmspritze übertragen: Die Appetitbremse fällt weg, sobald der Wirkstoff weitgehend abgebaut ist (Semaglutid nach etwa 5 Wochen weitgehend abgebaut, bis etwa 7 Wochen nachweisbar; Tirzepatid nach etwa 25 Tagen); die Hungerhormone Ghrelin und Leptin bleiben noch ein Jahr nach einer Diät verschoben; der Ruheenergieverbrauch blieb in einer kleinen Studie mit 14 Teilnehmenden, einem Extremfall, noch sechs Jahre nach starkem Gewichtsverlust abgesenkt; rund 40 Prozent des Gewichtsverlusts unter Semaglutid entfielen auf fettfreie Masse. In Studien halfen beim Halten: Krafttraining und Protein.</desc>
<rect width="1080" height="1350" fill="#EFEFEB"/>
<text x="64" y="101" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Warum das Gewicht nach dem</text><text x="64" y="158" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Absetzen zurückkommt</text><text x="64" y="211" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vier Mechanismen, nach Gewichtsverlust belegt und auf die Zeit nach</text><text x="64" y="248" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">der Spritze übertragen</text>
<text x="64" y="324" font-size="42" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5–7 Wochen</text><line x1="64" y1="342" x2="354" y2="342" stroke="#141513" stroke-width="3" stroke-linecap="butt"/><text x="64" y="380" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fachinformationen</text><text x="64" y="414" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(EMA)</text><text x="386" y="324" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="560" fill="#141513" style="font-stretch:108%;letter-spacing:-0.005em">Die Appetitbremse fällt weg.</tspan><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em"> Semaglutid</tspan></text><text x="386" y="364" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">ist nach etwa 5 Wochen weitgehend</tspan></text><text x="386" y="404" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">abgebaut, bis etwa 7 Wochen nachweisbar;</tspan></text><text x="386" y="444" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Tirzepatid nach etwa 25 Tagen.</tspan></text><line x1="64" y1="464.5" x2="1016" y2="464.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="508" font-size="42" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ghrelin ↑</text><text x="64" y="556" font-size="42" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leptin ↓</text><line x1="64" y1="574" x2="354" y2="574" stroke="#7A4718" stroke-width="3" stroke-linecap="butt"/><text x="64" y="612" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Sumithran et al.,</text><text x="64" y="646" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">NEJM 2011</text><text x="386" y="508" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="560" fill="#141513" style="font-stretch:108%;letter-spacing:-0.005em">Hungerhormone bleiben verschoben.</tspan></text><text x="386" y="548" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Noch ein Jahr nach einer Diät messbar:</tspan></text><text x="386" y="588" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">mehr Hunger, weniger Sättigung.</tspan></text><line x1="64" y1="666.5" x2="1016" y2="666.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="710" font-size="42" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6 Jahre</text><line x1="64" y1="728" x2="354" y2="728" stroke="#7A4718" stroke-width="3" stroke-linecap="butt"/><text x="64" y="766" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fothergill et al.,</text><text x="64" y="800" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Obesity 2016</text><text x="386" y="710" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="560" fill="#141513" style="font-stretch:108%;letter-spacing:-0.005em">Weniger Energie in Ruhe.</tspan><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em"> Der</tspan></text><text x="386" y="750" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Ruheenergieverbrauch blieb noch sechs</tspan></text><text x="386" y="790" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Jahre nach starkem Gewichtsverlust</tspan></text><text x="386" y="830" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">abgesenkt; kleine Studie, 14 Teilnehmende,</tspan></text><text x="386" y="870" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Extremfall.</tspan></text><line x1="64" y1="890.5" x2="1016" y2="890.5" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="934" font-size="42" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rund 40 %</text><line x1="64" y1="952" x2="354" y2="952" stroke="#2E5944" stroke-width="3" stroke-linecap="butt"/><text x="64" y="990" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP-1-DXA-Substudie</text><text x="64" y="1024" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2021</text><text x="386" y="934" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="560" fill="#141513" style="font-stretch:108%;letter-spacing:-0.005em">Ein Teil des Verlusts war fettfreie Masse.</tspan></text><text x="386" y="974" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Rund 40 % des Gewichtsverlusts unter</tspan></text><text x="386" y="1014" font-size="30" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="420" fill="#3F413C" style="font-stretch:100%;letter-spacing:0em">Semaglutid entfielen auf fettfreie Masse.</tspan></text><line x1="64" y1="1049" x2="1016" y2="1049" stroke="#5E605A" stroke-width="1"/><text x="64" y="1088" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">In Studien halfen beim Halten: Krafttraining (Jensen 2024, Sardeli</text><text x="64" y="1128" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2018) und Protein (Leidy 2015).</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was beim Abnehmen mit Semaglutid verloren geht</title>
<desc id="d">Balken, der den Gewichtsverlust nach 68 Wochen Semaglutid in einer DXA-Substudie mit 140 Teilnehmenden aufteilt: rund 60 Prozent Fettmasse und rund 40 Prozent fettfreie Masse, also Muskeln, Organe, Knochen und Wasser; wie viel davon Muskel war, wurde nicht getrennt gemessen. In Diätstudien hielt Krafttraining den Verlust an fettfreier Masse klein; empfohlen sind Krafttraining an mindestens zwei Tagen pro Woche und 1,2 bis 1,6 Gramm Protein pro Kilogramm Körpergewicht am Tag.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was beim Abnehmen mit Semaglutid verloren geht</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil am Gewichtsverlust nach 68 Wochen, STEP-1-Substudie mit DXA-Messung</text>
<text x="64" y="190" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anteil am verlorenen Gewicht nach 68 Wochen</text><rect class="mk" x="64" y="206" width="643.2" height="104" rx="3" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><rect class="mk" x="707.2" y="206" width="428.8" height="104" rx="3" fill="#2E5944"/><text x="88" y="260" font-size="30" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 60 %</text><text x="88" y="288" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">Fettmasse</text><text x="731.2" y="260" font-size="30" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" class="in">rund 40 %</text><text x="731.2" y="288" font-size="18" font-weight="560" fill="#EFEFEB" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" class="in">fettfreie Masse</text><line x1="64" y1="316" x2="64" y2="325" stroke="#5E605A" stroke-width="1"/><line x1="171.2" y1="316" x2="171.2" y2="321" stroke="#5E605A" stroke-width="1"/><line x1="278.4" y1="316" x2="278.4" y2="325" stroke="#5E605A" stroke-width="1"/><line x1="385.6" y1="316" x2="385.6" y2="321" stroke="#5E605A" stroke-width="1"/><line x1="492.8" y1="316" x2="492.8" y2="325" stroke="#5E605A" stroke-width="1"/><line x1="600" y1="316" x2="600" y2="321" stroke="#5E605A" stroke-width="1"/><line x1="707.2" y1="316" x2="707.2" y2="325" stroke="#5E605A" stroke-width="1"/><line x1="814.4" y1="316" x2="814.4" y2="321" stroke="#5E605A" stroke-width="1"/><line x1="921.6" y1="316" x2="921.6" y2="325" stroke="#5E605A" stroke-width="1"/><line x1="1028.8" y1="316" x2="1028.8" y2="321" stroke="#5E605A" stroke-width="1"/><line x1="1136" y1="316" x2="1136" y2="325" stroke="#5E605A" stroke-width="1"/><text x="64" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><text x="278.4" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">20 %</text><text x="492.8" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">40 %</text><text x="707.2" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">60 %</text><text x="921.6" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">80 %</text><text x="1136" y="346" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 %</text><text x="64" y="412" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fettfreie Masse heißt: Muskeln, Organe, Knochen, Wasser. Wie viel davon Muskel war, wurde nicht getrennt gemessen.</text><text x="64" y="450" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">In Diätstudien hielt Krafttraining den Verlust an fettfreier Masse klein. Empfohlen: Krafttraining an mindestens zwei Tagen</text><text x="64" y="476" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">pro Woche (WHO) und 1,2 bis 1,6 g Protein pro kg Körpergewicht am Tag (Leidy).</text><text x="64" y="514" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DXA-Substudie mit 140 Teilnehmenden, 68 Wochen, exploratorische Analyse; Anteile gerundet.</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Wilding et al., STEP 1 body composition, J Endocr Soc 2021; Sardeli et al. 2018; Leidy et al. 2015; WHO 2020</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

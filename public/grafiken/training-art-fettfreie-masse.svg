<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Welches Training beim Abnehmen Muskeln und Knochen schützt</title>
<desc id="d">Zwei Balkengruppen aus einer randomisierten Studie mit 160 Erwachsenen ab 65 Jahren mit Adipositas, 26 Wochen Diät und im Mittel 9 Prozent Gewichtsverlust: Verlust an fettfreier Masse mit Krafttraining 1,0 Kilogramm, mit Kraft plus Ausdauer 1,7 Kilogramm, mit Ausdauertraining 2,7 Kilogramm. Knochendichte der Hüfte: minus 3 Prozent mit Ausdauertraining, mit Krafttraining unter 1 Prozent und nicht signifikant.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="33.5" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Welches Training beim Abnehmen Muskeln und Knochen schützt</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Randomisierte Studie: 160 Erwachsene ab 65 Jahren mit Adipositas, 26 Wochen Diät, Gewicht im Mittel −9 %</text>
<text x="64" y="168" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verlust an fettfreier Masse</text><line x1="290" y1="190" x2="290" y2="382" stroke="#5E605A" stroke-width="1.2"/><text x="64" y="228" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Krafttraining</text><rect class="mk" x="290" y="209" width="83.3" height="26" rx="1" fill="#2E5944"/><text x="383.3" y="230" font-size="21" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1,0 kg</text><text x="64" y="290" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kraft plus Ausdauer</text><rect class="mk" x="290" y="271" width="141.7" height="26" rx="1" fill="#2E5944"/><text x="441.7" y="292" font-size="21" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−1,7 kg</text><text x="64" y="352" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausdauertraining</text><rect class="mk" x="290" y="333" width="225" height="26" rx="1" fill="#2E5944"/><text x="525" y="354" font-size="21" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2,7 kg</text><line x1="616" y1="150" x2="616" y2="400" stroke="#D3D4CD" stroke-width="1"/><text x="650" y="168" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Knochendichte der Hüfte</text><line x1="850" y1="190" x2="850" y2="320" stroke="#5E605A" stroke-width="1.2"/><text x="650" y="228" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ausdauertraining</text><rect class="mk" x="850" y="209" width="171.4" height="26" rx="1" fill="#141513"/><text x="1031.4" y="230" font-size="21" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−3 %</text><text x="650" y="290" font-size="17" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Krafttraining</text><rect class="mk" x="850" y="271" width="57.1" height="26" rx="1" fill="none" stroke="#5E605A" stroke-width="1.6" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="917.1" y="290" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">unter 1 %, nicht signifikant</text><line x1="64" y1="430" x2="1136" y2="430" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="470" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Bei gleicher Diät verlor die Krafttrainingsgruppe am wenigsten fettfreie Masse, und nur in der Ausdauergruppe sank die</text><text x="64" y="496" font-size="18" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Knochendichte der Hüfte messbar.</text><text x="64" y="560" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Beide Geschlechter; fettfreie Masse in kg, Knochendichte in Prozent gegenüber dem Start.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Villareal et al., NEJM 2017;376(20):1943–1955</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum nach dem Abnehmen weniger Energie gebraucht wird</title>
<desc id="d">Wasserfalldiagramm für eine Frau mit 45 Jahren und 170 Zentimetern: Vor dem Abnehmen mit 95 Kilogramm liegt der Tagesbedarf laut Formel bei 2.277 kcal. Der leichtere Körper senkt ihn um 210 kcal auf 2.067 kcal bei 80 Kilogramm. Die Anpassung nach Gewichtsverlust senkt den tatsächlichen Verbrauch in Messungen um weitere 300 bis 400 kcal, auf rund 1.700 bis 1.800 kcal; beim Ruheumsatz war die Anpassung in einer anderen Studie deutlich kleiner (92 kcal am Tag). Formel nach Mifflin-St-Jeor mal Aktivitätsfaktor 1,4, gerundet.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Warum nach dem Abnehmen weniger Energie gebraucht wird</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Rechenbeispiel: Frau, 45 Jahre, 170 cm, von 95 auf 80 kg; Tagesbedarf in kcal bei Aktivitätsfaktor 1,4</text>
<line class="g" x1="150" y1="470" x2="1136" y2="470" stroke="#5E605A" stroke-width="1.2"/><text x="136" y="475" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0</text><line class="g" x1="150" y1="410" x2="1136" y2="410" stroke="#D3D4CD" stroke-width="1"/><text x="136" y="415" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">500</text><line class="g" x1="150" y1="350" x2="1136" y2="350" stroke="#D3D4CD" stroke-width="1"/><text x="136" y="355" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.000</text><line class="g" x1="150" y1="290" x2="1136" y2="290" stroke="#D3D4CD" stroke-width="1"/><text x="136" y="295" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.500</text><line class="g" x1="150" y1="230" x2="953.1" y2="230" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="1086.9" y1="230" x2="1136" y2="230" stroke="#D3D4CD" stroke-width="1"/><text x="136" y="235" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.000</text><line class="g" x1="150" y1="170" x2="170.6" y2="170" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="269.4" y1="170" x2="372.4" y2="170" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="467.6" y1="170" x2="1136" y2="170" stroke="#D3D4CD" stroke-width="1"/><text x="136" y="175" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.500 kcal</text><rect class="mk" x="155" y="196.8" width="130" height="273.2" rx="1" fill="#141513"/><text x="220" y="184.8" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.277 kcal</text><line x1="285" y1="196.8" x2="355" y2="196.8" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="355" y="196.8" width="130" height="25.2" rx="1" fill="#E5E5DF" stroke="#5E605A" stroke-width="1.4"/><text x="420" y="184.8" font-size="18" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−210 kcal</text><line x1="485" y1="222" x2="555" y2="222" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="555" y="222" width="130" height="248" rx="1" fill="#141513"/><text x="620" y="210" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2.067 kcal</text><line x1="685" y1="222" x2="755" y2="222" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="755" y="222" width="130" height="36" rx="1" fill="#7A4718"/><rect class="mk" x="755" y="258" width="130" height="12" rx="2" fill="none" stroke="#7A4718" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="820" y="210" font-size="18" font-weight="560" fill="#7A4718" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−300 bis −400 kcal</text><line x1="885" y1="258" x2="955" y2="258" stroke="#5E605A" stroke-width="1" stroke-dasharray="3 4"/><rect class="mk" x="955" y="270" width="130" height="200" rx="1" fill="#141513"/><rect class="mk" x="955" y="258" width="130" height="12" rx="2" fill="none" stroke="#141513" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="1020" y="224" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rund 1.700 bis</text><text x="1020" y="246" font-size="18" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1.800 kcal</text><text x="220" y="494" font-size="16" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vorher</text><text x="220" y="513" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95 kg</text><text x="420" y="494" font-size="16" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leichterer</text><text x="420" y="513" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körper</text><text x="620" y="494" font-size="16" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Formel</text><text x="620" y="513" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">für 80 kg</text><text x="820" y="494" font-size="16" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Anpassung</text><text x="820" y="513" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach dem Abnehmen</text><text x="1020" y="494" font-size="16" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Realistisch</text><text x="1020" y="513" font-size="14" font-weight="420" fill="#3F413C" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mit Anpassung</text><text x="64" y="548" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Formel: Mifflin-St-Jeor mal 1,4, eigene Rechnung, gerundet. Anpassung: 300 bis 400 kcal Gesamtverbrauch in Messungen nach 10 % Gewichtsverlust; beim</text><text x="64" y="567" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ruheumsatz in einer anderen Studie deutlich weniger (Martins 2020: 92 kcal am Tag).</text>

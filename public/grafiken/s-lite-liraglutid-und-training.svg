<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Liraglutid mit oder ohne Training: was danach bleibt</title>
<desc id="d">Drei Kennzahlen aus der S-LiTE-Studie mit Liraglutid: Im Jahr ohne Behandlung (Woche 52 bis 104) nahmen Teilnehmende nach Liraglutid allein 6,0 Kilogramm mehr zu als nach Training allein ohne Medikament (95-Prozent-Konfidenzintervall 2,1 bis 10,0). Von Behandlungsbeginn (Woche 0, nach der Diät) bis ein Jahr nach dem Ende (Woche 104) lagen Teilnehmende mit Training plus Liraglutid 5,1 Kilogramm niedriger (minus 10,0 bis minus 0,2) und beim Körperfettanteil 2,3 Prozentpunkte niedriger (minus 4,3 bis minus 0,3) als nach Liraglutid allein. Nach Training blieben Gewicht und Körperzusammensetzung erhalten. Studienablauf: 8 Wochen Diät, 52 Wochen Behandlung, 52 Wochen ohne Behandlung.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Liraglutid mit oder ohne Training: was danach bleibt</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">S-LiTE: nach einer Diät ein Jahr Behandlung, danach ein Jahr ohne; Vergleiche der Gruppen mit 95-%-Konfidenzintervall</text>
<text x="64" y="164" font-size="16" font-weight="560" fill="#3F413C" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 52 bis 104</text><text x="64" y="184" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Jahr ohne Behandlung</text><text x="64" y="268" font-size="50" font-weight="500" fill="#7A4718" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+6,0 kg</text><text x="64" y="306" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mehr Zunahme nach Liraglutid</text><text x="64" y="330" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">allein</text><text x="64" y="360" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">als nach Training allein (ohne Medikament)</text><text x="64" y="389" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI 2,1 bis 10,0 kg</text><line x1="422" y1="150" x2="422" y2="420" stroke="#D3D4CD" stroke-width="1"/><text x="446" y="164" font-size="16" font-weight="560" fill="#3F413C" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 0 bis 104</text><text x="446" y="184" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Behandlungsbeginn (Woche 0, nach der Diät)</text><text x="446" y="202" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">bis ein Jahr nach dem Ende</text><text x="446" y="268" font-size="50" font-weight="500" fill="#2E5944" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5,1 kg</text><text x="446" y="306" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht mit Training plus</text><text x="446" y="330" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Liraglutid</text><text x="446" y="360" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gegenüber Liraglutid allein</text><text x="446" y="389" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI −10,0 bis −0,2 kg</text><line x1="804" y1="150" x2="804" y2="420" stroke="#D3D4CD" stroke-width="1"/><text x="828" y="164" font-size="16" font-weight="560" fill="#3F413C" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 0 bis 104</text><text x="828" y="184" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Behandlungsbeginn (Woche 0, nach der Diät)</text><text x="828" y="202" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">bis ein Jahr nach dem Ende</text><text x="828" y="268" font-size="50" font-weight="500" fill="#2E5944" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2,3 Punkte</text><text x="828" y="306" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körperfettanteil mit Training plus</text><text x="828" y="330" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Liraglutid</text><text x="828" y="360" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gegenüber Liraglutid allein (Prozentpunkte)</text><text x="828" y="389" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI −4,3 bis −0,3 Prozentpunkte</text><text x="64" y="446" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach Training, allein oder mit Liraglutid, blieben Gewicht und Körperzusammensetzung ein Jahr nach dem Ende erhalten; nach Liraglutid allein kam das</text><text x="64" y="465" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht zurück.</text><line x1="64" y1="484" x2="1136" y2="484" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="506" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Studienablauf (Abschnitte nicht maßstäblich), Erwachsene mit Adipositas</text><text x="64" y="531" font-size="14" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche −8 bis 0</text><text x="64" y="550" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kalorienarme Diät</text><line x1="64" y1="564" x2="406" y2="564" stroke="#5E605A" stroke-width="3" stroke-linecap="butt"/><text x="426" y="531" font-size="14" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 0 bis 52</text><text x="426" y="550" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo, Training, Liraglutid oder beides</text><line x1="426" y1="564" x2="768" y2="564" stroke="#141513" stroke-width="3" stroke-linecap="butt"/><text x="788" y="531" font-size="14" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 52 bis 104</text><text x="788" y="550" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohne jede Behandlung</text><line x1="788" y1="564" x2="1130" y2="564" stroke="#7A4718" stroke-width="3" stroke-linecap="butt"/>

e">+11,6 Prozentpunkte</text><text x="64" y="600" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Messpunkte Woche 0, 68 und 120; Verlauf dazwischen schematisch</text><line x1="675.3" y1="595" x2="701.3" y2="595" stroke="#141513" stroke-width="3" stroke-linecap="round"/><text x="709.3" y="600" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid 2,4 mg</text><line x1="858.2" y1="595" x2="884.2" y2="595" stroke="#7A4718" stroke-width="3" stroke-linecap="round"/><text x="892.2" y="600" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach dem Absetzen</text><line x1="1048.5" y1="595" x2="1074.5" y2="595" stroke="#878982" stroke-width="2.6" stroke-dasharray="0.1 6.5" stroke-linecap="round"/><text x="1082.5" y="600" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo</text>

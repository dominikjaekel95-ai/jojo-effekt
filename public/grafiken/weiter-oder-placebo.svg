<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Weiter behandeln oder absetzen: zwei randomisierte Studien</title>
<desc id="d">Balkendiagramm: In STEP 4 nahmen Teilnehmende unter fortgeführtem Semaglutid in 48 Wochen weitere 7,9 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 6,9 Prozent zu. In SURMOUNT-4 nahmen Teilnehmende unter fortgeführtem Tirzepatid in 52 Wochen weitere 5,5 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 14 Prozent zu.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandeln oder absetzen: zwei randomisierte Studien</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht nach dem Wechsel auf Placebo gegenüber Fortführung</text>
<text x="64" y="146" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Änderung des Körpergewichts ab dem Zeitpunkt des Wechsels; alle Teilnehmenden hatten davor mit dem Medikament abgenommen.</text><line class="g" x1="210" y1="482" x2="1136" y2="482" stroke="#D3D4CD" stroke-width="1"/><text x="196" y="487" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><line class="g" x1="210" y1="427" x2="1136" y2="427" stroke="#D3D4CD" stroke-width="1"/><text x="196" y="432" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><line class="g" x1="210" y1="372" x2="1136" y2="372" stroke="#5E605A" stroke-width="1.2"/><text x="196" y="377" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line class="g" x1="210" y1="317" x2="1136" y2="317" stroke="#D3D4CD" stroke-width="1"/><text x="196" y="322" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+5 %</text><line class="g" x1="210" y1="262" x2="1136" y2="262" stroke="#D3D4CD" stroke-width="1"/><text x="196" y="267" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+10 %</text><line class="g" x1="210" y1="207" x2="1136" y2="207" stroke="#D3D4CD" stroke-width="1"/><text x="196" y="212" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+15 %</text><rect class="mk" x="300" y="372" width="150" height="86.9" rx="1" fill="#141513"/><text x="375" y="446.9" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−7,9 %</text><text x="375" y="360" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandelt</text><rect class="mk" x="490" y="296.1" width="150" height="75.9" rx="1" fill="#7A4718"/><text x="565" y="326.1" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+6,9 %</text><text x="565" y="396" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wechsel auf Placebo</text><text x="470" y="530" font-size="22" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP 4</text><text x="470" y="554" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid, 48 Wochen nach dem Wechsel</text><rect class="mk" x="750" y="372" width="150" height="60.5" rx="1" fill="#141513"/><text x="825" y="420.5" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−5,5 %</text><text x="825" y="360" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandelt</text><rect class="mk" x="940" y="218" width="150" height="154" rx="1" fill="#7A4718"/><text x="1015" y="248" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+14 %</text><text x="1015" y="396" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wechsel auf Placebo</text><text x="920" y="530" font-size="22" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SURMOUNT-4</text><text x="920" y="554" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tirzepatid, 52 Wochen nach dem Wechsel</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Rubino et al., STEP 4, JAMA 2021; Aronne et al., SURMOUNT-4, JAMA 2024</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>

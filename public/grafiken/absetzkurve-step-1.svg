cing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 68</text><text x="910" y="536" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 120</text><line x1="580.7" y1="140" x2="580.7" y2="512" stroke="#141513" stroke-width="1.2"/><text x="589.7" y="150" font-size="16" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">letzte Dosis</text><text x="150" y="150" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">68 Wochen mit Semaglutid</text><text x="910" y="150" font-size="14" font-weight="420" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">52 Wochen ohne Medikament</text><path d="M150 176 C289.3333333333333 202.88 435 209.6 580.6666666666666 209.6 C694.6666666666666 209.6 796 184.4 910 177.68" fill="none" stroke="#878982" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0.1 6.5"/><path d="M150 176 C264 386 416 466.64 580.6666666666666 466.64" fill="none" stroke="#141513" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M580.6666666666666 466.64 C637.6666666666667 466.64 732.6666666666667 303.68 910 270.08" fill="none" stroke="#7A4718" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580.7" cy="209.6" r="4.5" fill="#878982" stroke="#EFEFEB" stroke-width="2"/><circle cx="910" cy="177.7" r="4.5" fill="#878982" stroke="#EFEFEB" stroke-width="2"/><circle cx="150" cy="176" r="6" fill="#141513" stroke="#EFEFEB" stroke-width="2"/><circle cx="580.7" cy="466.6" r="6" fill="#141513" stroke="#EFEFEB" stroke-width="2"/><circle cx="910" cy="270.1" r="6" fill="#7A4718" stroke="#EFEFEB" stroke-width="2"/><text x="566.7" y="502.6" font-size="30" font-weight="560" fill="#141513" text-anchor="end" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−17,3 %</text><text x="926" y="280.1" font-size="30" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5,6 %</text><text x="590.7" y="233.6" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo −2,0 %</text><text x="926" y="182.7" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−0,1 %</text><path d="M942 290.1 H950 V466.6 H942" fill="none" stroke="#7A4718" stroke-width="1.6"/><rect x="959" y="347.4" width="109.4" height="11.2" rx="2" fill="#E8CF55"/><text x="964" y="356.4" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em">zwei Drittel</text><text x="964" y="380.4" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wieder da</text><text x="964" y="404.4" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+11,6 Prozentpunkte</text><text x="64" y="568" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Messpunkte Woche 0, 68 und 120; Verlauf dazwischen schematisch</text><line x1="714.8" y1="563" x2="740.8" y2="563" stroke="#141513" stroke-width="3" stroke-linecap="round"/><text x="748.8" y="568" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid</text><line x1="852.7" y1="563" x2="878.7" y2="563" stroke="#7A4718" stroke-width="3" stroke-linecap="round"/><text x="886.7" y="568" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach dem Absetzen</text><line x1="1046.9" y1="563" x2="1072.9" y2="563" stroke="#878982" stroke-width="2.6" stroke-dasharray="0.1 6.5" stroke-linecap="round"/><text x="1080.9" y="568" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo</text>

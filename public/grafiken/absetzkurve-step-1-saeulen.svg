<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was nach dem Absetzen bleibt: ein Drittel</title>
<desc id="d">Zwei Säulen: Nach 68 Wochen Semaglutid sind im Mittel 17,3 Prozent des Gewichts verloren. Ein Jahr nach dem Absetzen sind 11,6 Prozentpunkte wieder zurück, 5,6 Prozent bleiben; das entspricht zwei Dritteln des Verlusts, die zurückkommen.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was nach dem Absetzen bleibt: ein Drittel</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP-1-Verlängerung: 68 Wochen Semaglutid, danach 52 Wochen ohne Medikament</text>
<text x="64" y="146" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittlere Gewichtsänderung gegenüber dem Start, Semaglutid-Gruppe der STEP-1-Verlängerung</text><line x1="230" y1="180" x2="1000" y2="180" stroke="#5E605A" stroke-width="1.2"/><text x="216" y="185" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line x1="230" y1="265" x2="1000" y2="265" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="270" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><line x1="230" y1="350" x2="1000" y2="350" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="355" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><line x1="230" y1="435" x2="1000" y2="435" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="440" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−15 %</text><line x1="230" y1="520" x2="1000" y2="520" stroke="#D3D4CD" stroke-width="1"/><text x="216" y="525" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−20 %</text><rect class="mk" x="300" y="180" width="200" height="294.1" rx="2" fill="#141513"/><text x="400" y="458.1" font-size="17" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" class="in">verloren</text><text x="400" y="510.1" font-size="28" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−17,3 %</text><rect class="mk" x="640" y="180" width="200" height="95.2" rx="2" fill="#141513"/><rect class="mk" x="640" y="275.2" width="200" height="198.9" rx="2" fill="#7A4718"/><text x="740" y="235.6" font-size="20" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−5,6 % bleibt</text><text x="740" y="370.7" font-size="22" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+11,6 Punkte</text><text x="740" y="396.7" font-size="16" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" class="in">wieder zurück</text><path d="M858 275.2 H866 V474.1 H858" fill="none" stroke="#7A4718" stroke-width="1.6"/><rect x="877" y="354.7" width="117.2" height="12.4" rx="2" fill="#E8CF55"/><text x="882" y="364.7" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em">zwei Drittel</text><text x="882" y="388.7" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">des Verlusts</text><text x="882" y="412.7" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">zurück</text><text x="400" y="556" font-size="17" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach 68 Wochen Semaglutid</text><text x="400" y="578" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(Woche 68, Ende der Behandlung)</text><text x="740" y="556" font-size="17" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ein Jahr nach dem Absetzen</text><text x="740" y="578" font-size="14" font-weight="420" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">(Woche 120, ohne Medikament)</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Wilding et al., STEP 1 trial extension, Diabetes Obes Metab 2022;24(8):1553–1564</text>

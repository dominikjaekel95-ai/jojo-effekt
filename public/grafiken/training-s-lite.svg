<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Training vor dem Absetzen: 6 kg Unterschied ein Jahr später</title>
<desc id="d">Diagramm aus der S-LiTE-Nachbeobachtung: Im Jahr nach Therapieende nahmen Teilnehmende nach Liraglutid allein 6,0 Kilogramm mehr zu als nach dem Trainingsprogramm (95-Prozent-Konfidenzintervall 2,1 bis 10,0) und 2,5 Kilogramm mehr als nach Training plus Liraglutid (−1,5 bis 6,5, nicht signifikant). Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau erhalten.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Training vor dem Absetzen: 6 kg Unterschied ein Jahr später</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">S-LiTE-Nachbeobachtung: Gewichtszunahme im Jahr nach Therapieende, Liraglutid allein gegenüber den Trainingsgruppen</text>
<text x="64" y="150" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8 Wochen</text><text x="64" y="172" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kalorienarme Diät</text><line x1="64" y1="188" x2="406" y2="188" stroke="#5E605A" stroke-width="3" stroke-linecap="butt"/><text x="426" y="150" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">52 Wochen Behandlung</text><text x="426" y="172" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo, Training, Liraglutid oder beides</text><line x1="426" y1="188" x2="768" y2="188" stroke="#141513" stroke-width="3" stroke-linecap="butt"/><text x="788" y="150" font-size="16" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">52 Wochen</text><text x="788" y="172" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohne jede Behandlung</text><line x1="788" y1="188" x2="1130" y2="188" stroke="#7A4718" stroke-width="3" stroke-linecap="butt"/><text x="64" y="232" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mehr-Zunahme nach Liraglutid allein im Jahr ohne Behandlung, verglichen mit …</text><line x1="440" y1="254" x2="440" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="440" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−2 kg</text><line x1="531.4" y1="254" x2="531.4" y2="446" stroke="#5E605A" stroke-width="1.2"/><text x="531.4" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 kg</text><line x1="622.9" y1="254" x2="622.9" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="622.9" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+2 kg</text><line x1="714.3" y1="254" x2="714.3" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="714.3" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+4 kg</text><line x1="805.7" y1="254" x2="805.7" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="805.7" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+6 kg</text><line x1="897.1" y1="254" x2="897.1" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="897.1" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+8 kg</text><line x1="988.6" y1="254" x2="988.6" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="988.6" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+10 kg</text><line x1="1080" y1="254" x2="1080" y2="446" stroke="#D3D4CD" stroke-width="1"/><text x="1080" y="470" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+12 kg</text><text x="64" y="302" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">… Training allein</text><text x="64" y="326" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI 2,1 bis 10,0 kg</text><line x1="627.4" y1="300" x2="988.6" y2="300" stroke="#7A4718" stroke-width="2.6"/><line x1="627.4" y1="291" x2="627.4" y2="309" stroke="#7A4718" stroke-width="2.6"/><line x1="988.6" y1="291" x2="988.6" y2="309" stroke="#7A4718" stroke-width="2.6"/><circle cx="805.7" cy="300" r="9" fill="#7A4718" stroke="#EFEFEB" stroke-width="2"/><text x="1004.6" y="309" font-size="24" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+6,0 kg</text><text x="64" y="398" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">… Training plus Liraglutid</text><text x="64" y="422" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">95-%-KI −1,5 bis 6,5 kg, nicht signifikant</text><line x1="462.9" y1="396" x2="828.6" y2="396" stroke="#7A4718" stroke-width="2.6"/><line x1="462.9" y1="387" x2="462.9" y2="405" stroke="#7A4718" stroke-width="2.6"/><line x1="828.6" y1="387" x2="828.6" y2="405" stroke="#7A4718" stroke-width="2.6"/><circle cx="645.7" cy="396" r="8" fill="#EFEFEB" stroke="#7A4718" stroke-width="2.6"/><text x="844.6" y="405" font-size="24" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+2,5 kg</text><text x="64" y="524" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach Training plus Liraglutid blieben Gewichtsverlust und Fettabbau ein Jahr nach Therapieende erhalten; nach Liraglutid allein kam das Gewicht zurück.</text><text x="64" y="545" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Erwachsene mit Adipositas, betreutes Trainingsprogramm; Linie = 95-%-Konfidenzintervall, Punkt = Mittelwert.</text>

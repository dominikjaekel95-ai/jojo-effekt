8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="798" y1="523.6" x2="798" y2="552" stroke="#D3D4CD" stroke-width="1"/><text x="798" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 12</text><line class="g" x1="944" y1="158" x2="944" y2="228.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="944" y1="270.6" x2="944" y2="364.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="944" y1="387.6" x2="944" y2="500.8" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="944" y1="523.6" x2="944" y2="552" stroke="#D3D4CD" stroke-width="1"/><text x="944" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 16</text><line class="g" x1="1090" y1="158" x2="1090" y2="552" stroke="#D3D4CD" stroke-width="1"/><text x="1090" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 20</text><text x="64" y="218" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wirkstoff im Körper</text><text x="64" y="240" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">am Beispiel Semaglutid</text><text x="360" y="244" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid (Halbwertszeit etwa 1 Woche) nach etwa 5 Wochen weitgehend abgebaut, laut Fachinformation</text><text x="360" y="263" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wegovy bis etwa 7 Wochen nachweisbar (gepunktet); Tirzepatid (etwa 5 Tage) schon nach etwa 25 Tagen</text><text x="64" y="354" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Appetit kommt zurück</text><text x="64" y="376" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">aus dem Wirkstoffspiegel</text><text x="360" y="380" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 2 bis 5, mit sinkendem Wirkstoffspiegel; bleibt danach (abgeleitet, nicht gemessen)</text><text x="64" y="490" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zunahme messbar</text><text x="64" y="512" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Meta-Analyse</text><text x="360" y="516" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ab etwa Woche 8 messbar, Anstieg bis etwa Woche 20 (Meta-Analyse randomisierter Studien)</text><rect class="mk" x="360" y="205" width="182.5" height="14" rx="2" fill="#141513"/><rect class="mk" x="542.5" y="205" width="73" height="14" rx="2" fill="none" stroke="#141513" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><rect class="mk" x="433" y="341" width="109.5" height="14" rx="2" fill="#7A4718"/><line x1="542.5" y1="348" x2="1090" y2="348" stroke="#7A4718" stroke-width="2"/><rect class="mk" x="652" y="477" width="438" height="14" rx="2" fill="#7A4718"/>

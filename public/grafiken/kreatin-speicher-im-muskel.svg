anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+20 %</text><text x="64" y="210" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 g pro Tag</text><text x="64" y="234" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ohne Ladephase</text><line class="g" x1="340" y1="422" x2="1080" y2="422" stroke="#5E605A" stroke-width="1.2"/><line class="g" x1="340" y1="334" x2="1080" y2="334" stroke="#D3D4CD" stroke-width="1"/><text x="328" y="427" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><text x="328" y="339" font-size="14" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+20 %</text><text x="64" y="366" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ladephase</text><text x="64" y="390" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">20 g pro Tag über 6 Tage,</text><text x="64" y="409" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">danach keine Einnahme</text><path d="M340 266 C458.92857142857144 222 577.8571428571429 180.2 710 178" fill="none" stroke="#2E5944" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="340" cy="266" r="6" fill="#2E5944" stroke="#EFEFEB" stroke-width="2"/><circle cx="710" cy="178" r="6" fill="#2E5944" stroke="#EFEFEB" stroke-width="2"/><text x="726" y="168" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">etwa +20 % nach 28 Tagen</text><text x="726" y="200" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Speicher voll nach etwa vier Wochen</text><path d="M340 422 C366.42857142857144 360.4 392.85714285714283 334 419.2857142857143 334 C538.2142857142858 334 683.5714285714286 404.4 815.7142857142858 422" fill="none" stroke="#2E5944" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="340" cy="422" r="6" fill="#2E5944" stroke="#EFEFEB" stroke-width="2"/><circle cx="419.3" cy="334" r="6" fill="#2E5944" stroke="#EFEFEB" stroke-width="2"/><circle cx="815.7" cy="422" r="6" fill="#2E5944" stroke="#EFEFEB" stroke-width="2"/><text x="435.3" y="322" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">etwa +20 % nach 6 Tagen</text><text x="829.7" y="388" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">30 Tage nach dem Ende:</text><text x="829.7" y="407" font-size="14" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wieder beim Ausgangswert</text><text x="64" y="504" font-size="16" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mit dem Speicher steigt das Wasser in der Muskelzelle. Die Waage zeigt das in den ersten Wochen; Fett ist es nicht.</text><text x="64" y="532" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Messpunkte der Studie: Ausgangswert, Tag 6, Tag 28 und 30 Tage nach dem Ende der Ladephase; Verlauf dazwischen schematisch.</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Die Absetzkurve in drei Zahlen</title>
<desc id="d">Drei Kennzahlen aus der STEP-1-Verlängerung: minus 17,3 Prozent Gewicht nach 68 Wochen Semaglutid, minus 5,6 Prozent ein Jahr nach dem Absetzen, zwei Drittel des Verlusts in 52 Wochen zurück. Placebo: minus 2,0 und minus 0,1 Prozent.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Die Absetzkurve in drei Zahlen</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Was die STEP-1-Verlängerung über das Jahr nach der letzten Dosis zeigt</text>
<rect x="56" y="200" width="320" height="260" rx="16" fill="#edebe6"/><text x="216" y="310" font-size="64" font-weight="700" fill="#4f6b57" text-anchor="middle" >−17,3 %</text><text x="216" y="370" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle" >nach 68 Wochen</text><text x="216" y="400" font-size="16" font-weight="400" fill="#4b4b4b" text-anchor="middle" >Semaglutid 2,4 mg</text><polygon points="392,330 430,310 430,350" fill="#6f6f6f"/><rect x="440" y="200" width="320" height="260" rx="16" fill="#edebe6"/><text x="600" y="310" font-size="64" font-weight="700" fill="#4f6b57" text-anchor="middle" >−5,6 %</text><text x="600" y="370" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle" >ein Jahr später</text><text x="600" y="400" font-size="16" font-weight="400" fill="#4b4b4b" text-anchor="middle" >ohne Medikament</text><polygon points="776,330 814,310 814,350" fill="#6f6f6f"/><rect x="824" y="200" width="320" height="260" rx="16" fill="#edebe6"/><text x="984" y="310" font-size="64" font-weight="700" fill="#a35f4d" text-anchor="middle" >⅔</text><text x="984" y="370" font-size="19" font-weight="600" fill="#1a1a1a" text-anchor="middle" >des Verlusts zurück</text><text x="984" y="400" font-size="16" font-weight="400" fill="#4b4b4b" text-anchor="middle" >in 52 Wochen</text><text x="56" y="520" font-size="17" font-weight="400" fill="#4b4b4b" text-anchor="start" >Placebo-Gruppe zum Vergleich: −2,0 % nach 68 Wochen, −0,1 % nach 120 Wochen.</text><text x="56" y="550" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Mittelwerte; die Streuung zwischen einzelnen Menschen ist groß.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Wilding et al., STEP 1 trial extension, Diabetes Obes Metab 2022;24(8):1553–1564</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Warum das Gewicht nach dem Absetzen zurückkommt</title>
<desc id="d">Vier Spalten mit den Mechanismen des Jojo-Effekts, nach Gewichtsverlust belegt und auf die Zeit nach der Abnehmspritze übertragen: Die Appetitbremse fällt weg, sobald der Wirkstoff weitgehend abgebaut ist (Semaglutid nach etwa fünf bis sieben Wochen, Tirzepatid nach etwa 25 Tagen); die Hungerhormone Ghrelin und Leptin bleiben noch ein Jahr nach einer Diät verschoben; der Ruheenergieverbrauch blieb in einer Studie noch sechs Jahre nach starkem Gewichtsverlust abgesenkt; rund 40 Prozent des Gewichtsverlusts unter Semaglutid entfielen auf fettfreie Masse. In Studien halfen beim Halten: Krafttraining und Protein.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Warum das Gewicht nach dem Absetzen zurückkommt</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vier Mechanismen, nach Gewichtsverlust belegt und auf die Zeit nach der Spritze übertragen</text>
<text x="64" y="214" font-size="27.5" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5–7 Wochen</text><line x1="64" y1="234" x2="304" y2="234" stroke="#141513" stroke-width="2" stroke-linecap="butt"/><text x="64" y="272" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Die Appetitbremse fällt</text><text x="64" y="297" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">weg</text><text x="64" y="333" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid ist nach etwa fünf</text><text x="64" y="356" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">bis sieben Wochen weitgehend</text><text x="64" y="379" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">abgebaut, Tirzepatid nach</text><text x="64" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">etwa 25 Tagen.</text><text x="64" y="446" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fachinformationen (EMA)</text><line x1="322" y1="182" x2="322" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="340" y="214" font-size="27.5" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ghrelin ↑ Leptin ↓</text><line x1="340" y1="234" x2="580" y2="234" stroke="#7A4718" stroke-width="2" stroke-linecap="butt"/><text x="340" y="272" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hungerhormone bleiben</text><text x="340" y="297" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">verschoben</text><text x="340" y="333" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Noch ein Jahr nach einer Diät</text><text x="340" y="356" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">messbar: mehr Hunger,</text><text x="340" y="379" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">weniger Sättigung.</text><text x="340" y="446" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Sumithran et al., NEJM 2011</text><line x1="598" y1="182" x2="598" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="616" y="214" font-size="27.5" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6 Jahre</text><line x1="616" y1="234" x2="856" y2="234" stroke="#7A4718" stroke-width="2" stroke-linecap="butt"/><text x="616" y="272" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weniger Energie in Ruhe</text><text x="616" y="333" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Der Ruheenergieverbrauch</text><text x="616" y="356" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">blieb noch sechs Jahre nach</text><text x="616" y="379" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">starkem Gewichtsverlust</text><text x="616" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">abgesenkt.</text><text x="616" y="446" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fothergill et al., Obesity 2016</text><line x1="874" y1="182" x2="874" y2="454" stroke="#D3D4CD" stroke-width="1"/><text x="892" y="214" font-size="27.5" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rund 40 %</text><line x1="892" y1="234" x2="1132" y2="234" stroke="#2E5944" stroke-width="2" stroke-linecap="butt"/><text x="892" y="272" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ein Teil des Verlusts war</text><text x="892" y="297" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">fettfreie Masse</text><text x="892" y="333" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Rund 40 % des</text><text x="892" y="356" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewichtsverlusts unter</text><text x="892" y="379" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid entfielen auf</text><text x="892" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">fettfreie Masse.</text><text x="892" y="446" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP-1-DXA-Substudie 2021</text><line x1="64" y1="486" x2="1136" y2="486" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="522" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">In Studien halfen beim Halten: Krafttraining (Jensen 2024, Sardeli 2018) und Protein (Leidy 2015).</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Fachinformationen (EMA); Sumithran 2011; Fothergill 2016; Wilding 2021; Jensen 2024; Sardeli 2018; Leidy 2015</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>

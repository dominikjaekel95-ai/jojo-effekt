<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Nach der letzten Dosis: vier Phasen</title>
<desc id="d">Vier Phasen nach der letzten Dosis einer Abnehmspritze: Woche 1 bis 2 noch wenig Veränderung, Woche 2 bis 5 kehrt der Appetit zurück, Woche 5 bis 8 ist der Wirkstoff praktisch abgebaut, ab Woche 8 ist die Gewichtszunahme messbar und steigt bis etwa Woche 20.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Nach der letzten Dosis: vier Phasen</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Der typische Verlauf, wie er aus Pharmakologie und Studien ableitbar ist</text>
<rect x="56" y="160" width="250" height="300" rx="14" fill="#edebe6"/><rect x="56" y="160" width="250" height="10" rx="5" fill="#4f6b57"/><text x="76" y="205" font-size="16" font-weight="600" fill="#4f6b57" text-anchor="start" >Woche 1 bis 2</text><text x="76" y="245" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Noch wenig</text><text x="76" y="272" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Veränderung</text><text x="76" y="318" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Genug Wirkstoff im Körper;</text><text x="76" y="341" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >viele merken keinen</text><text x="76" y="364" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Unterschied.</text><polygon points="312,300 326,310 312,320" fill="#6f6f6f"/><rect x="330" y="160" width="250" height="300" rx="14" fill="#edebe6"/><rect x="330" y="160" width="250" height="10" rx="5" fill="#a35f4d"/><text x="350" y="205" font-size="16" font-weight="600" fill="#a35f4d" text-anchor="start" >Woche 2 bis 5</text><text x="350" y="245" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Der Appetit</text><text x="350" y="272" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >kommt zurück</text><text x="350" y="318" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Wirkstoffspiegel sinkt, der</text><text x="350" y="341" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Magen arbeitet schneller,</text><text x="350" y="364" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Sättigung kommt später.</text><polygon points="586,300 600,310 586,320" fill="#6f6f6f"/><rect x="604" y="160" width="250" height="300" rx="14" fill="#edebe6"/><rect x="604" y="160" width="250" height="10" rx="5" fill="#6f6f6f"/><text x="624" y="205" font-size="16" font-weight="600" fill="#6f6f6f" text-anchor="start" >Woche 5 bis 8</text><text x="624" y="245" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Wirkstoff</text><text x="624" y="272" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >praktisch weg</text><text x="624" y="318" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Nach etwa fünf</text><text x="624" y="341" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Halbwertszeiten weitgehend</text><text x="624" y="364" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >abgebaut.</text><polygon points="860,300 874,310 860,320" fill="#6f6f6f"/><rect x="878" y="160" width="250" height="300" rx="14" fill="#edebe6"/><rect x="878" y="160" width="250" height="10" rx="5" fill="#a35f4d"/><text x="898" y="205" font-size="16" font-weight="600" fill="#a35f4d" text-anchor="start" >Ab Woche 8</text><text x="898" y="245" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Zunahme</text><text x="898" y="272" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >messbar</text><text x="898" y="318" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >In Studien ab Woche 8</text><text x="898" y="341" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >signifikant, Anstieg bis</text><text x="898" y="364" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >etwa Woche 20.</text><text x="56" y="510" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Halbwertszeiten laut Fachinformation (Semaglutid etwa eine Woche, Tirzepatid etwa fünf Tage); Zunahme laut Meta-Analyse randomisierter Studien.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="13.5" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Fachinformationen Wegovy und Mounjaro (EMA); Wu et al., Meta-Analyse, BMC Medicine 2025</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

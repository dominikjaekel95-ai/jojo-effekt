<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Haarausfall nach schnellem Gewichtsverlust: der Verlauf</title>
<desc id="d">Zeitachse des telogenen Effluviums: Nach schnellem Gewichtsverlust wechseln viele Haare in die Ruhephase, zwei bis drei Monate später beginnt diffuser Haarausfall, der in der Regel innerhalb von etwa sechs Monaten abklingt; danach wachsen die Haare nach. Beeinflussbar sind Protein, Eisenwert, Zink und Biotin bei Lücke; länger als sechs Monate, fleckig oder mit Müdigkeit ärztlich abklären.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#22201c" text-anchor="start" >Haarausfall nach schnellem Gewichtsverlust: der Verlauf</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4a463f" text-anchor="start" >Telogenes Effluvium: verzögert, diffus, vorübergehend; Zeitangaben in Monaten nach dem Auslöser</text>
<line x1="300" y1="150" x2="300" y2="440" stroke="#e2dace" stroke-width="1"/><text x="300" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Auslöser</text><line x1="391.1111111111111" y1="150" x2="391.1111111111111" y2="440" stroke="#e2dace" stroke-width="1"/><text x="391.1111111111111" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 1</text><line x1="482.2222222222222" y1="150" x2="482.2222222222222" y2="440" stroke="#e2dace" stroke-width="1"/><text x="482.2222222222222" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 2</text><line x1="573.3333333333333" y1="150" x2="573.3333333333333" y2="440" stroke="#e2dace" stroke-width="1"/><text x="573.3333333333333" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 3</text><line x1="664.4444444444443" y1="150" x2="664.4444444444443" y2="440" stroke="#e2dace" stroke-width="1"/><text x="664.4444444444443" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 4</text><line x1="755.5555555555557" y1="150" x2="755.5555555555557" y2="440" stroke="#e2dace" stroke-width="1"/><text x="755.5555555555557" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 5</text><line x1="846.6666666666666" y1="150" x2="846.6666666666666" y2="440" stroke="#e2dace" stroke-width="1"/><text x="846.6666666666666" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 6</text><line x1="937.7777777777778" y1="150" x2="937.7777777777778" y2="440" stroke="#e2dace" stroke-width="1"/><text x="937.7777777777778" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 7</text><line x1="1028.8888888888887" y1="150" x2="1028.8888888888887" y2="440" stroke="#e2dace" stroke-width="1"/><text x="1028.8888888888887" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 8</text><line x1="1120" y1="150" x2="1120" y2="440" stroke="#e2dace" stroke-width="1"/><text x="1120" y="142" font-size="13" font-weight="400" fill="#6b665d" text-anchor="middle" >Monat 9</text><defs><linearGradient id="hair" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#b8563e"/><stop offset="1" stop-color="#b8563e" stop-opacity="0.15"/></linearGradient></defs><text x="56" y="198" font-size="19" font-weight="700" fill="#22201c" text-anchor="start" >Schnelle Abnahme</text><rect x="300" y="176" width="182.22222222222217" height="28" rx="6" fill="#2f6b5a"/><text x="300" y="232" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Der Auslöser: Viele Haare wechseln gleichzeitig in die Ruhephase; sichtbar ist noch nichts</text><text x="56" y="298" font-size="19" font-weight="700" fill="#22201c" text-anchor="start" >Haare fallen aus</text><rect x="482.2222222222222" y="276" width="364.44444444444446" height="28" rx="6" fill="url(#hair)"/><text x="300" y="332" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Beginn zwei bis drei Monate nach dem Auslöser, diffus über den ganzen Kopf, dann abklingend</text><text x="56" y="398" font-size="19" font-weight="700" fill="#22201c" text-anchor="start" >Haare wachsen nach</text><rect x="755.5555555555557" y="376" width="364.44444444444434" height="28" rx="6" fill="#dcebe4" stroke="#2f6b5a" stroke-width="1.5"/><text x="300" y="432" font-size="14" font-weight="400" fill="#4a463f" text-anchor="start" >Meist innerhalb von etwa sechs Monaten abgeklungen, wenn der Auslöser weggefallen ist; bis zur alten Länge dauert es länger</text><rect x="56" y="470" width="1088" height="110" rx="12" fill="#f7f2ea"/><text x="76" y="502" font-size="16" font-weight="700" fill="#22201c" text-anchor="start" >Was sich beeinflussen lässt</text><text x="76" y="530" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Protein 1,2 bis 1,6 g pro kg Körpergewicht am Tag · Eisenwert (Ferritin) prüfen lassen · Zink und Biotin nur bei nachgewiesener Lücke</text><text x="76" y="558" font-size="15" font-weight="400" fill="#4a463f" text-anchor="start" >Ärztlich abklären: länger als sechs Monate, fleckig, oder mit Müdigkeit und Frieren (Eisen, Schilddrüse)</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#e2dace" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Quelle: Malkud, J Clin Diagn Res 2015; Leidy et al., Am J Clin Nutr 2015; Almandoz et al., Obesity 2024</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="end" >nachderspritze.de</text>
</svg>

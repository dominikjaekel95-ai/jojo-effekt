<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wechseljahre: was sich am Körper verschiebt</title>
<desc id="d">Zwei Balkengruppen aus der SWAN-Studie mit 1246 Frauen: Der jährliche Zuwachs an Fettmasse stieg von 0,25 Kilogramm vor dem Übergang auf 0,45 Kilogramm im Übergang. Die fettfreie Masse nahm vor dem Übergang um 0,2 Prozent pro Jahr zu und sank im Übergang um 0,2 Prozent pro Jahr. Beides lief bis etwa zwei Jahre nach der letzten Regelblutung weiter; das Gewicht selbst stieg nicht schneller als vorher.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wechseljahre: was sich am Körper verschiebt</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SWAN-Studie mit DXA-Messungen bei 1246 Frauen: jährliche Veränderung vor dem Übergang und im Übergang</text>
<text x="64" y="168" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fettmasse pro Jahr</text><line x1="64" y1="450" x2="560" y2="450" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="120" y="340" width="140" height="110" rx="1" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><text x="190" y="326" font-size="26" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,25 kg</text><text x="190" y="476" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">vor dem Übergang</text><rect class="mk" x="330" y="252" width="140" height="198" rx="1" fill="#B5A27C" stroke="#6F6247" stroke-width="1.4"/><text x="400" y="238" font-size="26" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,45 kg</text><text x="400" y="476" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">im Übergang</text><line x1="610" y1="150" x2="610" y2="490" stroke="#D3D4CD" stroke-width="1"/><text x="650" y="168" font-size="19" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fettfreie Masse pro Jahr</text><line x1="650" y1="330" x2="1136" y2="330" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="720" y="230" width="140" height="100" rx="1" fill="#2E5944"/><text x="790" y="216" font-size="26" font-weight="560" fill="#2E5944" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+0,2 %</text><rect class="mk" x="930" y="330" width="140" height="100" rx="1" fill="#2E5944"/><text x="1000" y="464" font-size="26" font-weight="560" fill="#2E5944" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−0,2 %</text><text x="790" y="356" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">vor dem Übergang</text><text x="1000" y="316" font-size="16" font-weight="560" fill="#3F413C" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">im Übergang</text><text x="64" y="530" font-size="17" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Beides lief bis etwa zwei Jahre nach der letzten Regelblutung weiter. Das Gewicht selbst stieg im Übergang nicht schneller als vorher.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Greendale et al., SWAN, JCI Insight 2019;4(5):e124865</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

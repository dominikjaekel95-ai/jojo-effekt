<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Weiter behandeln oder absetzen: zwei randomisierte Studien</title>
<desc id="d">Balkendiagramm: In STEP 4 nahmen Teilnehmende unter fortgeführtem Semaglutid in 48 Wochen weitere 7,9 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 6,9 Prozent zu. In SURMOUNT-4 nahmen Teilnehmende unter fortgeführtem Tirzepatid in 52 Wochen weitere 5,5 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 14 Prozent zu.</desc>
<rect width="1080" height="1350" fill="#EFEFEB"/>
<text x="64" y="101" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandeln oder absetzen: zwei</text><text x="64" y="158" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">randomisierte Studien</text><text x="64" y="211" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Gewicht nach dem Wechsel auf Placebo gegenüber Fortführung</text>
<text x="64" y="277" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Änderung des Körpergewichts ab dem Zeitpunkt des Wechsels; alle</text><text x="64" y="314" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Teilnehmenden hatten davor mit dem Medikament abgenommen.</text><text x="64" y="400" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STEP 4</text><text x="64" y="444" font-size="30" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid, 48 Wochen nach dem Wechsel</text><line class="g" x1="110" y1="512" x2="110" y2="702" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="282" y1="517.8" x2="282" y2="702" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="454" y1="512" x2="454" y2="702" stroke="#5E605A" stroke-width="1.4"/><line class="g" x1="626" y1="512" x2="626" y2="596" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="626" y1="635.8" x2="626" y2="702" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="798" y1="512" x2="798" y2="702" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="970" y1="512" x2="970" y2="702" stroke="#D3D4CD" stroke-width="1"/><text x="440" y="506" font-size="30" font-weight="560" fill="#3F413C" text-anchor="end" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandelt</text><rect class="mk" x="182.2" y="522" width="271.8" height="52" rx="1" fill="#141513"/><text x="318.1" y="562" font-size="40" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−7,9 %</text><text x="468" y="624" font-size="30" font-weight="560" fill="#3F413C" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wechsel auf Placebo</text><rect class="mk" x="454" y="640" width="237.4" height="52" rx="1" fill="#7A4718"/><text x="572.7" y="680" font-size="40" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+6,9 %</text><text x="64" y="784" font-size="40" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SURMOUNT-4</text><text x="64" y="828" font-size="30" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tirzepatid, 52 Wochen nach dem Wechsel</text><line class="g" x1="110" y1="896" x2="110" y2="1086" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="282" y1="901.8" x2="282" y2="1086" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="454" y1="896" x2="454" y2="1086" stroke="#5E605A" stroke-width="1.4"/><line class="g" x1="626" y1="896" x2="626" y2="980" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="626" y1="1019.8" x2="626" y2="1086" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="798" y1="896" x2="798" y2="1086" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="970" y1="896" x2="970" y2="1086" stroke="#D3D4CD" stroke-width="1"/><text x="440" y="890" font-size="30" font-weight="560" fill="#3F413C" text-anchor="end" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weiter behandelt</text><rect class="mk" x="264.8" y="906" width="189.2" height="52" rx="1" fill="#141513"/><text x="359.4" y="946" font-size="40" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">−5,5 %</text><text x="468" y="1008" font-size="30" font-weight="560" fill="#3F413C" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wechsel auf Placebo</text><rect class="mk" x="454" y="1024" width="481.6" height="52" rx="1" fill="#7A4718"/><text x="694.8" y="1064" font-size="40" font-weight="560" fill="#EFEFEB" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" class="in">+14 %</text><text x="110" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><text x="282" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><text x="454" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><text x="626" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+5 %</text><text x="798" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+10 %</text><text x="970" y="1126" font-size="30" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;
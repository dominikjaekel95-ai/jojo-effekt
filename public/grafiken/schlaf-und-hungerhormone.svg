<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Zwei kurze Nächte: Hungerhormone und Appetit</title>
<desc id="d">Balkendiagramm: Nach zwei Nächten mit 4 Stunden im Bett gegenüber zwei Nächten mit 10 Stunden sank das Sättigungshormon Leptin um 18 Prozent, das Hungerhormon Ghrelin stieg um 28 Prozent, der Hunger um 24 Prozent und der Appetit um 23 Prozent; der Appetit auf kalorienreiche Lebensmittel mit viel Kohlenhydraten stieg um 33 bis 45 Prozent. Kleine Studie mit 12 gesunden jungen Männern unter Laborbedingungen.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zwei kurze Nächte: Hungerhormone und Appetit</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nach zwei Nächten mit 4 Stunden im Bett gegenüber zwei Nächten mit 10 Stunden; 12 gesunde junge Männer</text>
<line x1="372" y1="158" x2="372" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="372" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−20 %</text><line x1="466" y1="158" x2="466" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="466" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><line x1="560" y1="158" x2="560" y2="500" stroke="#5E605A" stroke-width="1.2"/><text x="560" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line x1="654" y1="158" x2="654" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="654" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+10 %</text><line x1="748" y1="158" x2="748" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="748" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+20 %</text><line x1="842" y1="158" x2="842" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="842" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+30 %</text><line x1="936" y1="158" x2="936" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="936" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+40 %</text><line x1="1030" y1="158" x2="1030" y2="500" stroke="#D3D4CD" stroke-width="1"/><text x="1030" y="524" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+50 %</text><text x="64" y="190" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Leptin</text><text x="64" y="211" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Sättigungshormon</text><rect class="mk" x="390.8" y="176" width="169.2" height="24" rx="1" fill="#7A4718"/><text x="380.8" y="195" font-size="20" font-weight="560" fill="#7A4718" text-anchor="end" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−18 %</text><text x="64" y="258" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ghrelin</text><text x="64" y="279" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hungerhormon</text><rect class="mk" x="560" y="244" width="263.2" height="24" rx="1" fill="#7A4718"/><text x="833.2" y="263" font-size="20" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+28 %</text><text x="64" y="326" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Hunger</text><text x="64" y="347" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">eigene Einschätzung</text><rect class="mk" x="560" y="312" width="225.6" height="24" rx="1" fill="#7A4718"/><text x="795.6" y="331" font-size="20" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+24 %</text><text x="64" y="394" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Appetit</text><text x="64" y="415" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">eigene Einschätzung</text><rect class="mk" x="560" y="380" width="216.2" height="24" rx="1" fill="#7A4718"/><text x="786.2" y="399" font-size="20" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+23 %</text><text x="64" y="462" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Appetit auf Kalorienreiches</text><text x="64" y="483" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mit viel Kohlenhydraten, etwa Süßes und Salziges</text><rect class="mk" x="560" y="448" width="310.2" height="24" rx="1" fill="#7A4718"/><rect class="mk" x="870.2" y="448" width="112.8" height="24" rx="1" fill="none" stroke="#7A4718" stroke-width="1.6" stroke-dasharray="0.1 4.2" stroke-linecap="round"/><text x="993" y="467" font-size="20" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">+33 bis 45 %</text><text x="64" y="572" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kleine Studie unter Laborbedingungen mit festgelegter Kalorienzufuhr; sie zeigt die Richtung, nicht die Größe im Alltag.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Spiegel et al., Ann Intern Med 2004;141(11):846–850</text>

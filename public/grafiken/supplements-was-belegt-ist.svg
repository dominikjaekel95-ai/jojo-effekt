<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Supplements nach der Abnehmspritze: was belegt ist</title>
<desc id="d">Drei Spalten zu Supplements nach der Abnehmspritze. Belegt, mit Bedingung: Protein, wenn 1,2 bis 1,6 Gramm pro Kilogramm Körpergewicht am Tag über Mahlzeiten nicht zusammenkommen; Kreatin-Monohydrat, 3 Gramm täglich, nur mit Krafttraining; Ballaststoffe, wenn man unter 30 Gramm am Tag bleibt. Nur bei nachgewiesenem Mangel: Vitamin D nach Blutwert, Vitamin B12 bei Metformin oder veganer Ernährung kontrollieren, Eisen nur nach gemessenem Wert, Magnesium bei sehr kleinen Portionen. Kein Beleg für das Gewicht: Fatburner, Detox und Booster, sogenannte natürliche GLP-1-Booster wie Berberin, Probiotika gegen den Jojo-Effekt, Omega-3 für Gewicht oder Muskeln.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Supplements nach der Abnehmspritze: was belegt ist</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Drei Stufen nach Datenlage; alles nur als Ergänzung zu Ernährung und Training</text>
<text x="64" y="160" font-size="20" font-weight="560" fill="#2E5944" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Belegt, mit Bedingung</text><line x1="64" y1="176" x2="390" y2="176" stroke="#2E5944" stroke-width="4" stroke-linecap="butt"/><text x="64" y="214" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Protein</text><text x="64" y="236" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wenn 1,2 bis 1,6 g pro kg Körpergewicht am Tag</text><text x="64" y="256" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">über Mahlzeiten nicht zusammenkommen</text><text x="64" y="292" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kreatin-Monohydrat</text><text x="64" y="314" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3 g täglich, nur zusammen mit Krafttraining</text><text x="64" y="350" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ballaststoffe</text><text x="64" y="372" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">wenn du unter 30 g am Tag bleibst;</text><text x="64" y="392" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Lebensmittel zuerst</text><line x1="413" y1="196" x2="413" y2="516" stroke="#D3D4CD" stroke-width="1"/><text x="437" y="160" font-size="20" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nur bei nachgewiesenem Mangel</text><line x1="437" y1="176" x2="763" y2="176" stroke="#141513" stroke-width="4" stroke-linecap="butt"/><text x="437" y="214" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vitamin D</text><text x="437" y="236" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach Blutwert</text><text x="437" y="272" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Vitamin B12</text><text x="437" y="294" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">bei Metformin oder veganer Ernährung</text><text x="437" y="314" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kontrollieren lassen</text><text x="437" y="350" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Eisen</text><text x="437" y="372" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nur nach ärztlich gemessenem Wert, nie auf</text><text x="437" y="392" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verdacht</text><text x="437" y="428" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Magnesium</text><text x="437" y="450" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">bei sehr kleinen Portionen; Lebensmittel zuerst</text><line x1="786" y1="196" x2="786" y2="516" stroke="#D3D4CD" stroke-width="1"/><text x="810" y="160" font-size="20" font-weight="560" fill="#5E605A" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Kein Beleg für das Gewicht</text><line x1="810" y1="176" x2="1136" y2="176" stroke="#878982" stroke-width="2.6" stroke-dasharray="0.1 6.5" stroke-linecap="round"/><text x="810" y="214" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Fatburner, Detox, Booster</text><text x="810" y="236" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">keine Belege, teils riskante Inhaltsstoffe</text><text x="810" y="272" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">„Natürliche GLP-1-Booster“</text><text x="810" y="294" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Berberin, Extrakte: keine zugelassene Angabe,</text><text x="810" y="314" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mögliche Wechselwirkungen</text><text x="810" y="350" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Probiotika „gegen Jojo“</text><text x="810" y="372" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">keine Belege für Gewichtserhalt</text><text x="810" y="408" font-size="17" font-weight="580" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Omega-3</text><text x="810" y="430" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">kein Beleg für Gewicht oder Muskeln nach der</text><text x="810" y="450" font-size="15" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Spritze</text><text x="64" y="566" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Nahrungsergänzungsmittel sind Lebensmittel und werden nicht auf Wirksamkeit geprüft. Vitamine und Mineralstoffe: erst messen, dann ergänzen.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Leidy et al. 2015; Kreider et al. 2017; EU-Register zugelassener Angaben; DGE; ADA Standards of Care 2024;</text><text x="64" y="657" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verbraucherzentralen; Almandoz et al. 2024</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

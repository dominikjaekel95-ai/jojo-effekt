<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Semaglutid bei Typ-2-Diabetes: die Studie STEP 2</title>
<desc id="d">Balkendiagramm aus der Studie STEP 2 mit Erwachsenen mit Übergewicht und Typ-2-Diabetes: Nach 68 Wochen lag das Gewicht unter Semaglutid 2,4 Milligramm im Mittel 9,6 Prozent niedriger, unter Semaglutid 1,0 Milligramm 7,0 Prozent und unter Placebo 3,4 Prozent. Weniger Verlust heißt weniger, was nach dem Absetzen zurückkommen kann.</desc>
<rect width="1080" height="1350" fill="#EFEFEB"/>
<text x="64" y="101" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid bei Typ-2-Diabetes: die</text><text x="64" y="158" font-size="50" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Studie STEP 2</text><text x="64" y="211" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittlere Änderung des Körpergewichts nach 68 Wochen, Erwachsene</text><text x="64" y="248" font-size="28" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">mit Übergewicht und Typ-2-Diabetes</text>
<line class="g" x1="168" y1="394" x2="1016" y2="394" stroke="#5E605A" stroke-width="1.4"/><text x="146" y="404" font-size="30" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 %</text><line class="g" x1="168" y1="614" x2="781.2" y2="614" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="968.1" y1="614" x2="1016" y2="614" stroke="#D3D4CD" stroke-width="1"/><text x="146" y="624" font-size="30" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5 %</text><line class="g" x1="168" y1="834" x2="215.4" y2="834" stroke="#D3D4CD" stroke-width="1"/><line class="g" x1="403.3" y1="834" x2="1016" y2="834" stroke="#D3D4CD" stroke-width="1"/><text x="146" y="844" font-size="30" font-weight="440" fill="#5E605A" text-anchor="end" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−10 %</text><text x="309.3" y="322" font-size="34" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid</text><text x="309.3" y="364" font-size="34" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2,4 mg</text><rect class="mk" x="215.3" y="394" width="188" height="422.4" rx="1" fill="#141513"/><text x="309.3" y="872.4" font-size="52" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−9,6 %</text><text x="592" y="322" font-size="34" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid</text><text x="592" y="364" font-size="34" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1,0 mg</text><rect class="mk" x="498" y="394" width="188" height="308" rx="1" fill="#141513"/><text x="592" y="758" font-size="52" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−7,0 %</text><text x="874.7" y="364" font-size="34" font-weight="560" fill="#141513" text-anchor="middle" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo</text><rect class="mk" x="780.7" y="394" width="188" height="149.6" rx="2" fill="#E5E5DF" stroke="#878982" stroke-width="1.6" stroke-dasharray="0.1 4.5" stroke-linecap="round"/><text x="874.7" y="599.6" font-size="52" font-weight="560" fill="#5E605A" text-anchor="middle" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−3,4 %</text><text x="64" y="968.4" font-size="34" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Zum Einordnen</text><text x="64" y="1014.4" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Weniger Verlust heißt weniger, was nach dem Absetzen</text><text x="64" y="1054.4" font-size="30" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">zurückkommen kann. Am Mechanismus ändert das nichts.</text><text x="64" y="1116.4" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittelwerte nach 68 Wochen; randomisierte, placebokontrollierte</text><text x="64" y="1152.4" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Studie.</text>
<line class="fy" x1="64" y1="1196" x2="1016" y2="1196" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="1238" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Davies et al., STEP 2, Lancet 2021;397(10278):971–984</text><text x="64" y="1274" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe</text><text x="64" y="1310" font-size="28" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">(CC BY 4.0)</text><text x="1016" y="1310" font-size="30" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

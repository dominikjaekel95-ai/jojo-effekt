<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</title>
<desc id="d">Balkendiagramm der Halbwertszeiten: Semaglutid etwa eine Woche, weitgehend abgebaut nach etwa fünf Wochen; Tirzepatid etwa fünf Tage, abgebaut nach etwa 25 Tagen; Liraglutid etwa 13 Stunden, abgebaut nach etwa drei Tagen. Faustregel: fünf Halbwertszeiten.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#22201c" text-anchor="start" >Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4a463f" text-anchor="start" >Halbwertszeit laut Fachinformation und daraus abgeleitete Zeit bis zum weitgehenden Abbau</text>
<line x1="380" y1="150" x2="380" y2="520" stroke="#e2dace" stroke-width="1"/><text x="380" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >letzte Dosis</text><line x1="509.5" y1="150" x2="509.5" y2="520" stroke="#e2dace" stroke-width="1"/><text x="509.5" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Tag 7</text><line x1="639" y1="150" x2="639" y2="520" stroke="#e2dace" stroke-width="1"/><text x="639" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Tag 14</text><line x1="768.5" y1="150" x2="768.5" y2="520" stroke="#e2dace" stroke-width="1"/><text x="768.5" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Tag 21</text><line x1="898" y1="150" x2="898" y2="520" stroke="#e2dace" stroke-width="1"/><text x="898" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Tag 28</text><line x1="1027.5" y1="150" x2="1027.5" y2="520" stroke="#e2dace" stroke-width="1"/><text x="1027.5" y="142" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Tag 35</text><text x="56" y="200" font-size="22" font-weight="700" fill="#22201c" text-anchor="start" >Semaglutid</text><text x="56" y="224" font-size="14" font-weight="400" fill="#6b665d" text-anchor="start" >Wegovy (Spritze und Tablette), Ozempic, Rybelsus</text><rect x="380" y="180" width="129.5" height="24" rx="5" fill="#2f6b5a"/><text x="517.5" y="198" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="start" >Halbwertszeit etwa 1 Woche</text><rect x="380" y="212" width="647.5" height="24" rx="5" fill="#f7e3dc" stroke="#b8563e" stroke-width="1.5"/><text x="1035.5" y="230" font-size="15" font-weight="600" fill="#b8563e" text-anchor="start" >weitgehend abgebaut nach etwa 5 Wochen</text><text x="56" y="310" font-size="22" font-weight="700" fill="#22201c" text-anchor="start" >Tirzepatid</text><text x="56" y="334" font-size="14" font-weight="400" fill="#6b665d" text-anchor="start" >Mounjaro</text><rect x="380" y="290" width="92.5" height="24" rx="5" fill="#2f6b5a"/><text x="480.5" y="308" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="start" >Halbwertszeit etwa 5 Tage</text><rect x="380" y="322" width="462.5" height="24" rx="5" fill="#f7e3dc" stroke="#b8563e" stroke-width="1.5"/><text x="850.5" y="340" font-size="15" font-weight="600" fill="#b8563e" text-anchor="start" >weitgehend abgebaut nach etwa 25 Tage</text><text x="56" y="420" font-size="22" font-weight="700" fill="#22201c" text-anchor="start" >Liraglutid</text><text x="56" y="444" font-size="14" font-weight="400" fill="#6b665d" text-anchor="start" >Saxenda</text><rect x="380" y="400" width="10.020833333333314" height="24" rx="5" fill="#2f6b5a"/><text x="398.0208333333333" y="418" font-size="15" font-weight="600" fill="#2f6b5a" text-anchor="start" >Halbwertszeit etwa 13 Stunden</text><rect x="380" y="432" width="50.104166666666686" height="24" rx="5" fill="#f7e3dc" stroke="#b8563e" stroke-width="1.5"/><text x="438.1041666666667" y="450" font-size="15" font-weight="600" fill="#b8563e" text-anchor="start" >weitgehend abgebaut nach etwa 3 Tage</text><text x="56" y="560" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Faustregel: Nach etwa fünf Halbwertszeiten ist ein Wirkstoff weitgehend abgebaut. Die Wirkung auf den Appetit lässt schon vorher spürbar nach.</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie viel Protein nach der Abnehmspritze</title>
<desc id="d">Balkendiagramm des Proteinbedarfs von 1,2 bis 1,6 Gramm pro Kilogramm Körpergewicht: bei 60 Kilogramm 72 bis 96 Gramm am Tag, bei 70 Kilogramm 84 bis 112, bei 80 Kilogramm 96 bis 128, bei 90 Kilogramm 108 bis 144, bei 100 Kilogramm 120 bis 160 Gramm. Verteilt auf drei bis vier Mahlzeiten mit mindestens etwa 25 bis 30 Gramm pro Mahlzeit.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Wie viel Protein nach der Abnehmspritze</text>
<text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Tagesmenge nach Körpergewicht, Zielkorridor aus Übersichtsarbeiten</text>
<line x1="330" y1="156" x2="330" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="330" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">0 g</text><line x1="515" y1="156" x2="515" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="515" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">50 g</text><line x1="700" y1="156" x2="700" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="700" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 g</text><line x1="885" y1="156" x2="885" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="885" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">150 g</text><line x1="1070" y1="156" x2="1070" y2="470" stroke="#D3D4CD" stroke-width="1"/><text x="1070" y="146" font-size="14" font-weight="440" fill="#5E605A" text-anchor="middle" style="font-stretch:100%;letter-spacing:0em;font-variant-numeric:tabular-nums" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">200 g</text><text x="64" y="194" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">60 kg</text><text x="136.7" y="194" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht</text><line x1="330" y1="188" x2="596.4" y2="188" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="596.4" y="177" width="88.8" height="22" rx="2" fill="#2E5944"/><text x="697.2" y="194" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">72 bis 96 g am Tag</text><text x="64" y="254" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">70 kg</text><text x="134.9" y="254" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht</text><line x1="330" y1="248" x2="640.8" y2="248" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="640.8" y="237" width="103.6" height="22" rx="2" fill="#2E5944"/><text x="756.4" y="254" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">84 bis 112 g am Tag</text><text x="64" y="314" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">80 kg</text><text x="136.3" y="314" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht</text><line x1="330" y1="308" x2="685.2" y2="308" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="685.2" y="297" width="118.4" height="22" rx="2" fill="#2E5944"/><text x="815.6" y="314" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">96 bis 128 g am Tag</text><text x="64" y="374" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">90 kg</text><text x="136.7" y="374" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht</text><line x1="330" y1="368" x2="729.6" y2="368" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="729.6" y="357" width="133.2" height="22" rx="2" fill="#2E5944"/><text x="874.8" y="374" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">108 bis 144 g am Tag</text><text x="64" y="434" font-size="22" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:118%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">100 kg</text><text x="145.9" y="434" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Körpergewicht</text><line x1="330" y1="428" x2="774" y2="428" stroke="#5E605A" stroke-width="1.2"/><rect class="mk" x="774" y="417" width="148" height="22" rx="2" fill="#2E5944"/><text x="934" y="434" font-size="16" font-weight="580" fill="#2E5944" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">120 bis 160 g am Tag</text><text x="64" y="520" font-size="17" font-weight="420" fill="#141513" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Empfehlung für Gewichtsabnahme und -erhalt: 1,2 bis 1,6 g Protein pro kg Körpergewicht und Tag.</text><text x="64" y="550" font-size="15" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Verteilt auf drei bis vier Mahlzeiten mit mindestens etwa 25 bis 30 g pro Mahlzeit; bei Nierenerkrankungen vorher ärztlich klären.</text>
<line x1="64" y1="613" x2="1136" y2="613" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="638" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Quelle: Leidy et al., Am J Clin Nutr 2015;101(6):1320S–1329S</text>
<text x="1136" y="638" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nachderspritze.de</text>
</svg>

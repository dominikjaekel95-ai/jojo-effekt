<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was Abnehmspritzen und die Tablette im Monat kosten</title>
<desc id="d">Balkendiagramm der monatlichen Selbstzahlerpreise, Stand 30. September 2026: Wegovy Spritze, 0,25 bis 1,0 mg ca. 170 Euro; Wegovy Spritze, 1,7 mg ca. 235 Euro; Wegovy Spritze, 2,4 mg ca. 280 Euro; Wegovy Tablette, 1,5 mg und 4 mg (30 Stück) ca. 175 Euro; Wegovy Tablette, 9 mg (30 Stück) ca. 235 Euro; Wegovy Tablette, 25 mg (30 Stück) ca. 280 Euro; Ozempic, 0,5 und 1 mg (nur für Typ-2-Diabetes zugelassen) ca. 100 Euro; Mounjaro, 2,5 mg ca. 205 Euro; Mounjaro, 5 mg ca. 280 Euro; Mounjaro, 7,5 mg und 10 mg ca. 385 Euro; Mounjaro, 12,5 mg und 15 mg ca. 490 Euro; Saxenda (5 Pens, etwa 30 Tage bei der höchsten Stufe) ca. 290 Euro. Größenordnungen, gerundet auf 5 Euro; Ozempic ist bei Typ-2-Diabetes Kassenleistung.</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Haarausfall nach schnellem Gewichtsverlust: der Verlauf</title>
<desc id="d">Zeitachse des telogenen Effluviums über zwölf Monate: Nach schnellem Gewichtsverlust wechseln viele Haare in die Ruhephase, zwei bis drei Monate später beginnt diffuser Haarausfall, der meist innerhalb von etwa sechs Monaten nach Beginn abklingt, wenn der Auslöser weggefallen ist; danach wachsen die Haare nach. Beeinflussbar sind Protein, Eisenwert, Zink und Biotin bei Lücke; länger als sechs Monate, fleckig oder mit Müdigkeit und Frieren ärztlich abklären.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Haarausfall nach schnellem Gewichtsverlust: der Verlauf</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Telogenes Effluvium: verzögert, diffus, vorübergehend; Zeitangaben in Monaten nach dem Auslöser</text>
<line x1="300" y1="150" x2="300" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="300" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Auslöser</text><line x1="368.3333333333333" y1="150" x2="368.3333333333333" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="368.3333333333333" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Monat 1</text><line x1="436.66666666666663" y1="150" x2="436.66666666666663" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="436.66666666666663" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >2</text><line x1="505" y1="150" x2="505" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="505" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >3</text><line x1="573.3333333333333" y1="150" x2="573.3333333333333" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="573.3333333333333" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >4</text><line x1="641.6666666666667" y1="150" x2="641.6666666666667" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="641.6666666666667" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >5</text><line x1="710" y1="150" x2="710" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="710" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >6</text><line x1="778.3333333333334" y1="150" x2="778.3333333333334" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="778.3333333333334" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >7</text><line x1="846.6666666666666" y1="150" x2="846.6666666666666" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="846.6666666666666" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >8</text><line x1="915" y1="150" x2="915" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="915" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >9</text><line x1="983.3333333333334" y1="150" x2="983.3333333333334" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="983.3333333333334" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >10</text><line x1="1051.6666666666665" y1="150" x2="1051.6666666666665" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="1051.6666666666665" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >11</text><line x1="1120" y1="150" x2="1120" y2="440" stroke="#dedbd4" stroke-width="1"/><text x="1120" y="142" font-size="13" font-weight="400" fill="#6f6f6f" text-anchor="middle" >12</text><defs><linearGradient id="hair" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#a35f4d"/><stop offset="0.3" stop-color="#a35f4d"/><stop offset="1" stop-color="#a35f4d" stop-opacity="0.12"/></linearGradient></defs><text x="56" y="198" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" >Schnelle Abnahme</text><rect x="300" y="176" width="136.66666666666663" height="28" rx="6" fill="#4f6b57"/><text x="300" y="232" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Der Auslöser: Viele Haare wechseln gleichzeitig in die Ruhephase; sichtbar ist noch nichts</text><text x="56" y="298" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" >Haare fallen aus</text><rect x="436.66666666666663" y="276" width="478.33333333333337" height="28" rx="6" fill="url(#hair)"/><text x="300" y="332" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Beginnt zwei bis drei Monate nach dem Auslöser; klingt meist innerhalb von etwa sechs Monaten nach Beginn ab</text><text x="56" y="398" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" >Haare wachsen nach</text><rect x="710" y="376" width="410" height="28" rx="6" fill="#e3eae4" stroke="#4f6b57" stroke-width="1.5"/><text x="300" y="432" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start" >Nachwachsende Haare werden sichtbar, sobald der Auslöser weggefallen ist; bis zur alten Länge dauert es länger</text><rect x="56" y="470" width="1088" height="110" rx="12" fill="#edebe6"/><text x="76" y="502" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="start" >Was sich beeinflussen lässt</text><text x="76" y="530" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >Protein 1,2 bis 1,6 g pro kg Körpergewicht am Tag · Eisenwert (Ferritin) prüfen lassen · Zink und Biotin nur bei nachgewiesener Lücke</text><text x="76" y="558" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >Ärztlich abklären: länger als sechs Monate, fleckig, oder mit Müdigkeit und Frieren (Eisen, Schilddrüse)</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="13.5" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Malkud, J Clin Diagn Res 2015; Leidy et al., Am J Clin Nutr 2015; Almandoz et al., Obesity 2024</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Die Absetzkurve in drei Zahlen</title>
<desc id="d">Drei Kennzahlen aus der STEP-1-Verlängerung: minus 17,3 Prozent Gewicht nach 68 Wochen Semaglutid, minus 5,6 Prozent gegenüber dem Start ein Jahr nach dem Absetzen (Woche 120), zwei Drittel des Verlusts in 52 Wochen zurück. Placebo: minus 2,0 und minus 0,1 Prozent.</desc>
<rect width="1200" height="675" fill="#EFEFEB"/>
<text x="64" y="72" font-size="34" font-weight="540" fill="#141513" text-anchor="start" style="font-stretch:116%;letter-spacing:-0.02em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Die Absetzkurve in drei Zahlen</text><text x="64" y="106" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Was die STEP-1-Verlängerung über das Jahr nach der letzten Dosis zeigt</text>
<text x="64" y="236" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 68</text><text x="64" y="330" font-size="76" font-weight="500" fill="#141513" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−17,3 %</text><text x="64" y="376" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">nach 68 Wochen</text><text x="64" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Semaglutid, gegenüber dem Start</text><line x1="422" y1="216" x2="422" y2="420" stroke="#D3D4CD" stroke-width="1"/><text x="446" y="236" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 120</text><text x="446" y="330" font-size="76" font-weight="500" fill="#141513" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">−5,6 %</text><text x="446" y="376" font-size="18" font-weight="560" fill="#141513" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">gegenüber dem Start</text><text x="446" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ein Jahr nach dem Absetzen</text><line x1="804" y1="216" x2="804" y2="420" stroke="#D3D4CD" stroke-width="1"/><text x="828" y="236" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Woche 68 bis 120</text><rect x="823" y="292" width="142.7" height="47.1" rx="2" fill="#E8CF55"/><text x="828" y="330" font-size="76" font-weight="500" fill="#141513" text-anchor="start" style="font-stretch:125%;letter-spacing:-0.025em">2/3</text><text x="828" y="376" font-size="18" font-weight="560" fill="#7A4718" text-anchor="start" style="font-stretch:108%;letter-spacing:-0.005em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">des Verlusts zurück</text><text x="828" y="402" font-size="16" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">in 52 Wochen ohne Medikament</text><line x1="64" y1="466" x2="1136" y2="466" stroke="#D3D4CD" stroke-width="1"/><text x="64" y="508" font-size="18" font-weight="420" fill="#3F413C" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Placebo-Gruppe zum Vergleich: −2,0 % nach 68 Wochen, −0,1 % nach 120 Wochen.</text><text x="64" y="538" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Mittelwerte; die Streuung zwischen einzelnen Menschen ist groß.</text>
<line class="fy" x1="64" y1="598" x2="1136" y2="598" stroke="#D3D4CD" stroke-width="1"/>
<text x="64" y="622" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Quelle: Wilding et al., STEP-1-Verlängerung, Diabetes Obes Metab 2022;24(8):1553–1564</text><text x="64" y="641" font-size="14" font-weight="420" fill="#5E605A" text-anchor="start" style="font-stretch:100%;letter-spacing:0em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">Grafik: Nach der Spritze, frei verwendbar mit Quellenangabe (CC BY 4.0)</text><text x="1136" y="622" font-size="15" font-weight="600" fill="#141513" text-anchor="end" style="font-stretch:125%;letter-spacing:-0.01em" stroke="#EFEFEB" stroke-width="5" stroke-linejoin="round" paint-order="stroke" class="ft">nachderspritze.de</text>
</svg>

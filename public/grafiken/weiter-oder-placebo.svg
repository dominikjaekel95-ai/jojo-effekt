<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Weiter behandeln oder absetzen: zwei randomisierte Studien</title>
<desc id="d">Balkendiagramm: In STEP 4 nahmen Teilnehmende unter fortgeführtem Semaglutid in 48 Wochen weitere 7,9 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 6,9 Prozent zu. In SURMOUNT-4 nahmen Teilnehmende unter fortgeführtem Tirzepatid in 52 Wochen weitere 5,5 Prozent ab, nach dem Wechsel auf Placebo nahmen sie 14 Prozent zu.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Weiter behandeln oder absetzen: zwei randomisierte Studien</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Gewicht nach dem Wechsel auf Placebo gegenüber Fortführung</text>
<line x1="200" y1="520" x2="1140" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="188" y="525" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >−10 %</text><line x1="200" y1="455" x2="1140" y2="455" stroke="#dedbd4" stroke-width="1"/><text x="188" y="460" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >−5 %</text><line x1="200" y1="390" x2="1140" y2="390" stroke="#6f6f6f" stroke-width="1.5"/><text x="188" y="395" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >0 %</text><line x1="200" y1="325" x2="1140" y2="325" stroke="#dedbd4" stroke-width="1"/><text x="188" y="330" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >+5 %</text><line x1="200" y1="260" x2="1140" y2="260" stroke="#dedbd4" stroke-width="1"/><text x="188" y="265" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >+10 %</text><line x1="200" y1="195" x2="1140" y2="195" stroke="#dedbd4" stroke-width="1"/><text x="188" y="200" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="end" >+15 %</text><rect x="300" y="390" width="150" height="102.69999999999999" rx="6" fill="#4f6b57"/><text x="375" y="518.7" font-size="22" font-weight="700" fill="#4f6b57" text-anchor="middle" >−7,9 %</text><text x="375" y="378" font-size="15" font-weight="600" fill="#4b4b4b" text-anchor="middle" >Weiter behandelt</text><rect x="490" y="300.3" width="150" height="89.69999999999999" rx="6" fill="#a35f4d"/><text x="565" y="288.3" font-size="22" font-weight="700" fill="#a35f4d" text-anchor="middle" >+6,9 %</text><text x="565" y="416" font-size="15" font-weight="600" fill="#4b4b4b" text-anchor="middle" >Wechsel auf Placebo</text><text x="470" y="580" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle" >STEP 4</text><text x="470" y="604" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Semaglutid 2,4 mg, 48 Wochen nach dem Wechsel</text><rect x="770" y="390" width="150" height="71.5" rx="6" fill="#4f6b57"/><text x="845" y="487.5" font-size="22" font-weight="700" fill="#4f6b57" text-anchor="middle" >−5,5 %</text><text x="845" y="378" font-size="15" font-weight="600" fill="#4b4b4b" text-anchor="middle" >Weiter behandelt</text><rect x="960" y="208" width="150" height="182" rx="6" fill="#a35f4d"/><text x="1035" y="196" font-size="22" font-weight="700" fill="#a35f4d" text-anchor="middle" >+14 %</text><text x="1035" y="416" font-size="15" font-weight="600" fill="#4b4b4b" text-anchor="middle" >Wechsel auf Placebo</text><text x="940" y="580" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle" >SURMOUNT-4</text><text x="940" y="604" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tirzepatid, 52 Wochen nach dem Wechsel</text><text x="56" y="140" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Änderung des Körpergewichts ab dem Zeitpunkt des Wechsels; alle Teilnehmenden hatten davor mit dem Medikament abgenommen.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Rubino et al., STEP 4, JAMA 2021; Aronne et al., SURMOUNT-4, JAMA 2024</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>

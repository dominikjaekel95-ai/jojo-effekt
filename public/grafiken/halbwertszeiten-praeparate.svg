<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</title>
<desc id="d">Balkendiagramm der Halbwertszeiten: Semaglutid etwa eine Woche, weitgehend abgebaut nach etwa fünf Wochen und laut Fachinformation bis etwa sieben Wochen nachweisbar; Tirzepatid etwa fünf Tage, abgebaut nach etwa 25 Tagen; Liraglutid etwa 13 Stunden, abgebaut nach etwa drei Tagen. Faustregel: fünf Halbwertszeiten.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Wie lange die Abnehmspritze nach der letzten Dosis nachwirkt</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Halbwertszeit laut Fachinformation und daraus abgeleitete Zeit bis zum weitgehenden Abbau</text>
<line x1="380" y1="150" x2="380" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="380" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >letzte Dosis</text><line x1="483.6" y1="150" x2="483.6" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="483.6" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 7</text><line x1="587.2" y1="150" x2="587.2" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="587.2" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 14</text><line x1="690.8" y1="150" x2="690.8" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="690.8" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 21</text><line x1="794.4000000000001" y1="150" x2="794.4000000000001" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="794.4000000000001" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 28</text><line x1="898" y1="150" x2="898" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="898" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 35</text><line x1="1001.6" y1="150" x2="1001.6" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="1001.6" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 42</text><line x1="1105.1999999999998" y1="150" x2="1105.1999999999998" y2="520" stroke="#dedbd4" stroke-width="1"/><text x="1105.1999999999998" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Tag 49</text><text x="56" y="200" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" >Semaglutid</text><text x="56" y="224" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Wegovy (Spritze und Tablette),</text><text x="56" y="242" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Ozempic, Rybelsus</text><rect x="380" y="180" width="103.60000000000002" height="24" rx="5" fill="#4f6b57"/><text x="491.6" y="198" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="start" >Halbwertszeit etwa 1 Woche</text><rect x="380" y="212" width="518" height="24" rx="5" fill="#f3e4df" stroke="#a35f4d" stroke-width="1.5"/><text x="888" y="230" font-size="15" font-weight="600" fill="#a35f4d" text-anchor="end" >weitgehend abgebaut nach etwa 5 Wochen</text><rect x="898" y="212" width="207.19999999999982" height="24" rx="5" fill="none" stroke="#a35f4d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1001.5999999999999" y="229" font-size="12.5" font-weight="400" fill="#a35f4d" text-anchor="middle" >nachweisbar bis etwa 7 Wochen</text><text x="56" y="310" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" >Tirzepatid</text><text x="56" y="334" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Mounjaro</text><rect x="380" y="290" width="74" height="24" rx="5" fill="#4f6b57"/><text x="462" y="308" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="start" >Halbwertszeit etwa 5 Tage</text><rect x="380" y="322" width="370" height="24" rx="5" fill="#f3e4df" stroke="#a35f4d" stroke-width="1.5"/><text x="740" y="340" font-size="15" font-weight="600" fill="#a35f4d" text-anchor="end" >weitgehend abgebaut nach etwa 25 Tagen</text><text x="56" y="420" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" >Liraglutid</text><text x="56" y="444" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Saxenda</text><rect x="380" y="400" width="8.016666666666652" height="24" rx="5" fill="#4f6b57"/><text x="396.01666666666665" y="418" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="start" >Halbwertszeit etwa 13 Stunden</text><rect x="380" y="432" width="40.083333333333314" height="24" rx="5" fill="#f3e4df" stroke="#a35f4d" stroke-width="1.5"/><text x="428.0833333333333" y="450" font-size="15" font-weight="600" fill="#a35f4d" text-anchor="start" >weitgehend abgebaut nach etwa 3 Tagen</text><text x="56" y="560" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Faustregel: Nach etwa fünf Halbwertszeiten ist ein Wirkstoff weitgehend abgebaut. Die Wirkung auf den Appetit lässt schon vorher spürbar nach.</text><text x="56" y="586" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="start" >Laut Fachinformation ist Semaglutid nach der letzten Dosis noch etwa sieben Wochen im Blut nachweisbar; daher die Angabe „fünf bis sieben Wochen“.</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="13.5" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Fachinformationen Wegovy, Ozempic, Rybelsus, Mounjaro, Saxenda (EMA-Produktinformationen)</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

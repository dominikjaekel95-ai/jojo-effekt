<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Die ersten 20 Wochen nach der letzten Dosis</title>
<desc id="d">Zeitachse über 20 Wochen nach der letzten Dosis einer Abnehmspritze: Der Wirkstoff ist nach etwa fünf bis sieben Wochen weitgehend abgebaut, der Appetit kehrt ab Woche 2 bis 5 zurück, die Gewichtszunahme ist ab Woche 8 messbar und steigt bis etwa Woche 20. Ein Kontrolltermin 8 bis 12 Wochen nach der letzten Dosis ist markiert.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Die ersten 20 Wochen nach der letzten Dosis</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >Was aus Pharmakologie und Studien ableitbar ist; der individuelle Verlauf weicht ab</text>
<line x1="330" y1="150" x2="330" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="330" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 0</text><line x1="488" y1="150" x2="488" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="488" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 4</text><line x1="646" y1="150" x2="646" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="646" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 8</text><line x1="804" y1="150" x2="804" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="804" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 12</text><line x1="962" y1="150" x2="962" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="962" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 16</text><line x1="1120" y1="150" x2="1120" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="1120" y="142" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >Woche 20</text><defs><linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4f6b57"/><stop offset="1" stop-color="#4f6b57" stop-opacity="0.08"/></linearGradient></defs><text x="56" y="198" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Wirkstoff im Körper</text><rect x="330" y="176" width="276.5" height="28" rx="6" fill="url(#fade)"/><text x="330" y="234" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >nach etwa fünf Halbwertszeiten weitgehend abgebaut (Semaglutid ≈ 1 Woche, Tirzepatid ≈ 5 Tage)</text><text x="56" y="298" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Appetit kommt zurück</text><rect x="527.5" y="276" width="592.5" height="28" rx="6" fill="#a35f4d" opacity="0.18"/><rect x="409" y="276" width="118.5" height="28" rx="6" fill="#a35f4d"/><text x="330" y="334" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >Woche 2 bis 5, mit sinkendem Wirkstoffspiegel; bleibt danach</text><text x="56" y="398" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Zunahme messbar</text><rect x="646" y="376" width="474" height="28" rx="6" fill="#a35f4d"/><polygon points="1120,368 1138,390 1120,412" fill="#a35f4d"/><text x="330" y="434" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >ab Woche 8 signifikant, Anstieg bis etwa Woche 20 (Meta-Analyse randomisierter Studien)</text><text x="56" y="498" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="start" >Kontrolltermin</text><rect x="646" y="483" width="158" height="14" rx="6" fill="#6f6f6f"/><text x="330" y="534" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start" >Ärztlicher Kontrolltermin 8 bis 12 Wochen nach der letzten Dosis: dann zeigt sich, ob die Zunahme beginnt</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#dedbd4" stroke-width="1"/>
<text x="56" y="651" font-size="13.5" font-weight="400" fill="#6f6f6f" text-anchor="start" >Quelle: Fachinformationen Wegovy und Mounjaro (EMA); Wu et al., Meta-Analyse, BMC Medicine 2025</text>
<text x="1144" y="651" font-size="15" font-weight="600" fill="#4f6b57" text-anchor="end" >nachderspritze.de</text>
</svg>

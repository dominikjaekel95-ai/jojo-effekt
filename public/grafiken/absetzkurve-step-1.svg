<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Gewicht nach dem Absetzen der Abnehmspritze</title>
<desc id="d">Liniendiagramm: Unter Semaglutid 2,4 mg sinkt das Gewicht in 68 Wochen im Mittel um 17,3 Prozent, unter Placebo um 2,0 Prozent. In den 52 Wochen nach dem Absetzen steigt es wieder; nach insgesamt 120 Wochen liegt es bei minus 5,6 Prozent (Semaglutid) und minus 0,1 Prozent (Placebo). Zwei Drittel des Verlusts sind nach einem Jahr ohne Medikament wieder da.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#22201c" text-anchor="start" >Gewicht nach dem Absetzen der Abnehmspritze</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4a463f" text-anchor="start" >Mittlere Gewichtsänderung gegenüber dem Start: 68 Wochen Semaglutid, danach 52 Wochen ohne Medikament</text>
<rect x="120" y="160" width="555.3333333333334" height="400" fill="#dcebe4" opacity="0.45"/><text x="397.6666666666667" y="150" font-size="16" font-weight="600" fill="#2f6b5a" text-anchor="middle" >Behandlung: 68 Wochen</text><text x="887.6666666666667" y="150" font-size="16" font-weight="600" fill="#b8563e" text-anchor="middle" >Ohne Medikament: 52 Wochen</text><line x1="120" y1="170" x2="1100" y2="170" stroke="#e2dace" stroke-width="1"/><text x="108" y="176" font-size="15" font-weight="400" fill="#6b665d" text-anchor="end" >0 %</text><line x1="120" y1="265" x2="1100" y2="265" stroke="#e2dace" stroke-width="1"/><text x="108" y="271" font-size="15" font-weight="400" fill="#6b665d" text-anchor="end" >−5 %</text><line x1="120" y1="360" x2="1100" y2="360" stroke="#e2dace" stroke-width="1"/><text x="108" y="366" font-size="15" font-weight="400" fill="#6b665d" text-anchor="end" >−10 %</text><line x1="120" y1="455" x2="1100" y2="455" stroke="#e2dace" stroke-width="1"/><text x="108" y="461" font-size="15" font-weight="400" fill="#6b665d" text-anchor="end" >−15 %</text><line x1="120" y1="550" x2="1100" y2="550" stroke="#e2dace" stroke-width="1"/><text x="108" y="556" font-size="15" font-weight="400" fill="#6b665d" text-anchor="end" >−20 %</text><line x1="120" y1="170" x2="120" y2="556" stroke="#e2dace" stroke-width="1"/><text x="120" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 0</text><line x1="283.3333333333333" y1="170" x2="283.3333333333333" y2="556" stroke="#e2dace" stroke-width="1"/><text x="283.3333333333333" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 20</text><line x1="446.66666666666663" y1="170" x2="446.66666666666663" y2="556" stroke="#e2dace" stroke-width="1"/><text x="446.66666666666663" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 40</text><line x1="675.3333333333334" y1="170" x2="675.3333333333334" y2="556" stroke="#e2dace" stroke-width="1"/><text x="675.3333333333334" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 68</text><line x1="773.3333333333333" y1="170" x2="773.3333333333333" y2="556" stroke="#e2dace" stroke-width="1"/><text x="773.3333333333333" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 80</text><line x1="936.6666666666667" y1="170" x2="936.6666666666667" y2="556" stroke="#e2dace" stroke-width="1"/><text x="936.6666666666667" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 100</text><line x1="1100" y1="170" x2="1100" y2="556" stroke="#e2dace" stroke-width="1"/><text x="1100" y="578" font-size="14" font-weight="400" fill="#6b665d" text-anchor="middle" >Woche 120</text><path d="M120 170 L675.3333333333334 208 L1100 171.9" fill="none" stroke="#b8563e" stroke-width="4" stroke-linejoin="round"/><path d="M120 170 L675.3333333333334 498.7 L1100 276.4" fill="none" stroke="#2f6b5a" stroke-width="5" stroke-linejoin="round"/><circle cx="120" cy="170" r="7" fill="#2f6b5a" stroke="#ffffff" stroke-width="3"/><circle cx="675.3333333333334" cy="498.7" r="7" fill="#2f6b5a" stroke="#ffffff" stroke-width="3"/><circle cx="1100" cy="276.4" r="7" fill="#2f6b5a" stroke="#ffffff" stroke-width="3"/><circle cx="120" cy="170" r="6" fill="#b8563e" stroke="#ffffff" stroke-width="3"/><circle cx="675.3333333333334" cy="208" r="6" fill="#b8563e" stroke="#ffffff" stroke-width="3"/><circle cx="1100" cy="171.9" r="6" fill="#b8563e" stroke="#ffffff" stroke-width="3"/><text x="661.3333333333334" y="528.7" font-size="20" font-weight="700" fill="#2f6b5a" text-anchor="end" >−17,3 %</text><text x="1110" y="283.4" font-size="20" font-weight="700" fill="#2f6b5a" text-anchor="start" >−5,6 %</text><text x="685.3333333333334" y="232" font-size="15" font-weight="600" fill="#b8563e" text-anchor="start" >Placebo −2,0 %</text><text x="1110" y="161.9" font-size="15" font-weight="600" fill="#b8563e" text-anchor="start" >−0,1 %</text><text x="944.8333333333334" y="436" font-size="17" font-weight="700" fill="#22201c" text-anchor="middle" >Ein Jahr ohne Medikament:</text><text x="944.8333333333334" y="460.7" font-size="17" font-weight="700" fill="#22201c" text-anchor="middle" >zwei Drittel des Verlusts wieder da</text><text x="944.8333333333334" y="485.40000000000003" font-size="16" font-weight="400" fill="#4a463f" text-anchor="middle" >(+11,6 Prozentpunkte)</text><text x="56" y="128" font-size="14" font-weight="400" fill="#6b665d" text-anchor="start" >Semaglutid 2,4 mg (STEP-1-Verlängerung) gegenüber Placebo; Messpunkte Woche 0, 68 und 120, Verbindungslinien schematisch</text>
<line x1="56" y1="623" x2="1144" y2="623" stroke="#e2dace" stroke-width="1"/>
<text x="56" y="651" font-size="15" font-weight="400" fill="#6b665d" text-anchor="start" >Quelle: Wilding et al., STEP 1 trial extension, Diabetes Obes Metab 2022;24(8):1553–1564</text>

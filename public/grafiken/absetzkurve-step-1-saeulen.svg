<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="'Hanken Grotesk Variable', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Was nach dem Absetzen bleibt: ein Drittel</title>
<desc id="d">Zwei Säulen: Nach 68 Wochen Semaglutid sind im Mittel 17,3 Prozent des Gewichts verloren. Ein Jahr nach dem Absetzen sind 11,6 Prozentpunkte wieder zurück, 5,6 Prozent bleiben; das entspricht zwei Dritteln des Verlusts, die zurückkommen.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="56" y="62" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start" >Was nach dem Absetzen bleibt: ein Drittel</text>
<text x="56" y="98" font-size="19" font-weight="400" fill="#4b4b4b" text-anchor="start" >STEP-1-Verlängerung: 68 Wochen Semaglutid, danach 52 Wochen ohne Medikament</text>
<line x1="200" y1="200" x2="1140" y2="200" stroke="#dedbd4" stroke-width="1"/><text x="188" y="205" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="end" >0 %</text><line x1="200" y1="285" x2="1140" y2="285" stroke="#dedbd4" stroke-width="1"/><text x="188" y="290" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="end" >−5 %</text><line x1="200" y1="370" x2="1140" y2="370" stroke="#dedbd4" stroke-width="1"/><text x="188" y="375" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="end" >−10 %</text><line x1="200" y1="455" x2="1140" y2="455" stroke="#dedbd4" stroke-width="1"/><text x="188" y="460" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="end" >−15 %</text><line x1="200" y1="540" x2="1140" y2="540" stroke="#dedbd4" stroke-width="1"/><text x="188" y="545" font-size="15" font-weight="400" fill="#6f6f6f" text-anchor="end" >−20 %</text><rect x="300" width="220" y="200" height="294.1" rx="8" fill="#4f6b57"/><text x="410" y="528.1" font-size="20" font-weight="700" fill="#4f6b57" text-anchor="middle" >−17,3 % verloren</text><text x="410" y="590" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle" >Nach 68 Wochen Semaglutid</text><rect x="760" width="220" y="200" height="95.19999999999999" rx="8" fill="#4f6b57"/><rect x="760" width="220" y="295.2" height="198.90000000000003" rx="8" fill="#a35f4d" opacity="0.85"/><text x="870" y="254.6" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" >−5,6 % bleibt</text><text x="870" y="391.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" >+11,6 Punkte</text><text x="870" y="415.5" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" >wieder zurück</text><text x="870" y="590" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle" >Ein Jahr nach dem Absetzen</text><text x="870" y="614" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >(Woche 120, ohne Medikament)</text><text x="410" y="614" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="middle" >(Woche 68, Ende der Behandlung)</text><path d="M560 494.1 L600 494.1 L600 295.2 L560 295.2" fill="none" stroke="#6f6f6f" stroke-width="1.5"/><text x="585" y="388.65" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="middle" >zwei</text><text x="585" y="408.65" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="middle" >Drittel</text><text x="56" y="140" font-size="14" font-weight="400" fill="#6f6f6f" text-anchor="start" >Mittlere Gewichtsänderung gegenüber dem Start, Semaglutid-Gruppe der STEP-1-Verlängerung</text>
